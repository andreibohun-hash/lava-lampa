// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
const cv = $('cv'), ctx = cv.getContext('2d');
const VW = 400;                                    // виртуальная ширина; логика и раскладка в виртуальных юнитах (§2)
let scale = 1, W = VW, H = 640, DPR = 1, LAY = null, lastFitKey = '';
const QUALITY = { cell: CFG.FIELD_CELL, sum: 0, n: 0 };   // клетка поля плотности: грубеет сама, если кадр не успевает
function fit(){
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), key = r.width + 'x' + r.height + '@' + dpr;
  if (key === lastFitKey) return;
  lastFitKey = key; DPR = dpr;
  scale = r.width / VW; W = VW; H = r.height / scale;
  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
  LAY = null; layout(); BG = null;
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; log('event', G.paused ? 'pause' : 'resume'); });

// --- раскладка сцены: лампы на полке, всё масштабируется под высоту кадра ---
function glassProfile(u){            // полуширина колбы в долях ширины лампы; u: 0 — дно, 1 — горлышко
  if (u < CFG.GLASS_WIDE_U){ const t = Math.max(0, u) / CFG.GLASS_WIDE_U; return CFG.GLASS_BOT + (0.5 - CFG.GLASS_BOT) * Math.sin(t * Math.PI / 2); }
  const t = Math.min(1, (u - CFG.GLASS_WIDE_U) / (1 - CFG.GLASS_WIDE_U));
  return 0.5 + (CFG.GLASS_TOP - 0.5) * (t * t * (3 - 2 * t) * 0.4 + t * 0.6);
}
function hwAt(L, y){ return L.W * glassProfile((L.gBot - y) / L.GH); }
function slotY(L, j){ return L.gBot - L.padB - (j + 0.5) * L.slotH; }
function layout(){
  if (LAY || !G.s) return;
  const n = G.s.lamps.length, gi = Math.min(n, 3) - 1;
  const need = CFG.TOP_PAD + CFG.CAP_H + CFG.LAMP_H[gi] + CFG.BASE_H - CFG.BASE_CUP + CFG.SHELF_H;
  const k = Math.min(CFG.LAYOUT_MAX_K, H / need);
  const shelfTop = H - CFG.SHELF_H * k;
  const lamps = [];
  for (let i = 0; i < n; i++){
    const Wl = CFG.LAMP_W[gi] * k, GH = CFG.LAMP_H[gi] * k, cx = CFG.LAMP_X[gi][i % 3];
    const gBot = shelfTop - (CFG.BASE_H - CFG.BASE_CUP) * k, gTop = gBot - GH;
    const padB = CFG.PAD_BOT * k, slotH = (GH - padB - CFG.PAD_TOP * k) / CFG.CAP;
    const L = { i, cx, W: Wl, GH, gBot, gTop, k, padB, slotH, ry: slotH * 0.5 * CFG.BLOB_RY, rxBase: Wl * CFG.BLOB_RX, baseTop: gBot - CFG.BASE_CUP * k, baseBot: shelfTop + 3 * k };
    // контур колбы: левая стенка снизу вверх, правая сверху вниз
    const p = new Path2D(), N = 30;
    for (let s = 0; s <= N; s++){ const u = s / N, y = gBot - GH * u, x = cx - Wl * glassProfile(u); if (s) p.lineTo(x, y); else p.moveTo(x, y); }
    for (let s = N; s >= 0; s--){ const u = s / N; p.lineTo(cx + Wl * glassProfile(u), gBot - GH * u); }
    p.closePath(); L.path = p;
    // сетка поля плотности
    const cell = QUALITY.cell, gw = Math.ceil((Wl + 8) / cell), gh = Math.ceil((GH + 8) / cell);
    const c = document.createElement('canvas'); c.width = gw; c.height = gh;
    const g = { x0: cx - Wl / 2 - 4, y0: gTop - 4, gw, gh, cell, cv: c, ctx: c.getContext('2d'), F: [], used: [false, false, false, false, false, false], rowMin: 0, rowMax: -1,
      HV: new Float32Array(gw * gh), HT: new Float32Array(gw * gh), V1: new Float32Array(gw * gh), V2: new Float32Array(gw * gh), C1: new Uint8Array(gw * gh) };
    const ar = mulberry32(900 + i * 17 + n * 5); L.amb = [];
    for (let q = 0; q < CFG.AMB_BUBBLES; q++) L.amb.push({ fx: ar(), sp: 0.05 + ar() * 0.09, ph: ar(), r: 1.2 + ar() * 2.6 });
    for (let q = 0; q < 6; q++) g.F.push(new Float32Array(gw * gh));
    g.img = g.ctx.createImageData(gw, gh);
    L.grid = g;
    lamps.push(L);
  }
  LAY = { k, shelfTop, lamps };
}

// --- палитра из CSS-переменных (§9) ---
const PAL = {};
function hexRgb(h){ h = h.replace('#', ''); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function rgba(c, a){ return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }
function readPalette(){
  const cs = getComputedStyle(document.documentElement), g = (n) => cs.getPropertyValue(n).trim();
  PAL.bg1 = g('--bg1'); PAL.bg2 = g('--bg2'); PAL.rim = g('--glass-rim');
  PAL.wax = ['--wax-a', '--wax-b', '--wax-c', '--wax-d', '--wax-e', '--wax-frozen'].map(n => hexRgb(g(n)));
  PAL.liquid = hexRgb(g('--liquid')); PAL.liquidTop = hexRgb(g('--liquid-top')); PAL.bgGlow = hexRgb(g('--bg1'));
  PAL.metal = [g('--metal-1'), g('--metal-2'), g('--metal-3')];
  PAL.wood = [g('--wood-1'), g('--wood-2')];
  PAL.heatOn = hexRgb(g('--heat-on')); PAL.heatOff = g('--heat-off'); PAL.ink = g('--ink');
  // ореол капли: предрендер в offscreen-canvas, в кадре — только drawImage аддитивом (ART-PLAN, «Палитра и свет»)
  { const s = document.createElement('canvas'); s.width = s.height = 96; const x = s.getContext('2d'), gr = x.createRadialGradient(48, 48, 2, 48, 48, 48);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,250,235,0.55)'); gr.addColorStop(1, 'rgba(255,240,210,0)'); x.fillStyle = gr; x.fillRect(0, 0, 96, 96); PAL.white = s; }   // белая вспышка «бульк»
  PAL.glow = PAL.wax.map(c => {
    const s = document.createElement('canvas'); s.width = s.height = 96;
    const x = s.getContext('2d'), gr = x.createRadialGradient(48, 48, 4, 48, 48, 48);
    gr.addColorStop(0, rgba(c, 0.85)); gr.addColorStop(0.45, rgba(c, 0.32)); gr.addColorStop(1, rgba(c, 0));
    x.fillStyle = gr; x.fillRect(0, 0, 96, 96);
    return s;
  });
}

// --- поза капли в момент t: положение, размеры, вес в поле ---
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function smooth(x){ x = clamp01(x); return x * x * (3 - 2 * x); }
function backOut(q){ q = clamp01(q); return 1 + 2.2 * Math.pow(q - 1, 3) + 1.2 * Math.pow(q - 1, 2); }
// «Желе»: сумма затухающих колебаний от толчков (отрыв, посадка, «бульк»). Время абсолютное — никакого интегрирования.
function jelly(b, t){
  const ks = b.kicks; let j = 0;
  for (let i = ks.length - 1; i >= 0; i--){
    const dt = (t - ks[i].t0) * G.timeScale / 1000;
    if (dt < 0) continue;
    if (dt * 1000 > CFG.JELLY_LIFE_MS){ ks.splice(i, 1); continue; }
    j += ks[i].a * Math.exp(-dt * CFG.JELLY_DAMP) * Math.sin(dt * CFG.JELLY_FREQ);
  }
  return j;
}
// Толчок по столбику лампы из точки y: волна доходит до капли с задержкой и слабеет с расстоянием.
function kick(lampI, y, amp, t, skipId){
  if (V.flushing || !LAY) return;
  const L = LAY.lamps[lampI]; if (!L) return;
  for (const b of V.blobs.values()){
    if (b.lamp !== lampI || b.id === skipId || b.kicks.length >= 6) continue;
    const d = Math.abs(b.py - y) / L.slotH;
    b.kicks.push({ t0: t + d * CFG.JELLY_DELAY_MS / G.timeScale, a: amp / (1 + d * 0.55) });
  }
}
// Положение капли на пути подъёма (или погружения, если тяжёлая) в доле p: «присед», затем дуга вдоль стенки.
// Той же функцией считается хвост-нить: он идёт по тем же точкам с отставанием.
function riseAt(m, home, L, p){
  const wu = CFG.RISE_WINDUP, dip = m.dir * 3.5 * L.k;
  if (p < wu){ const q = Math.sin(Math.PI * 0.5 * p / wu); return { x: L.cx, y: m.y0 + dip * q, sx: 1 + 0.13 * q, sy: 1 - 0.17 * q, boost: 0, arc: 0 }; }
  const pp = (p - wu) / (1 - wu), e = pp < 0.5 ? 4 * pp * pp * pp : 1 - Math.pow(-2 * pp + 2, 3) / 2;
  const y = m.y0 + dip + (home - m.y0 - dip) * e, arc = Math.sin(Math.PI * e);
  const room = Math.max(0, hwAt(L, y) - L.rxBase * CFG.RISE_SLIM - CFG.WALL_GAP * L.k);
  return { x: L.cx + m.side * Math.min(room, L.rxBase * CFG.RISE_SIDE) * arc, y, sx: 1 - (1 - CFG.RISE_SLIM) * arc, sy: 1 + CFG.RISE_STRETCH * arc, boost: 0.7 * arc, arc };
}
function poseBlob(b, t, L){
  const home = slotY(L, b.slot);
  let x = L.cx, y = home, sx = 1, sy = 1, boost = 0, arc = 0, hot = 0;
  const m = b.mo;
  if (m){
    const p = clamp01((t - m.t0) / Math.max(1, m.t1 - m.t0));
    if (m.kind === 'rise'){                       // «нехотя»: приседает, вытягивается, уходит к стенке, обтекает столбик, шлёпается на место
      const r = riseAt(m, home, L, p);
      x = r.x; y = r.y; sx *= r.sx; sy *= r.sy; boost = r.boost; arc = r.arc;
    } else if (m.kind === 'settle'){
      const e = 1 - Math.pow(1 - p, 3);
      y = m.y0 + (home - m.y0) * e;
      const q = Math.sin(Math.PI * p); sy *= 1 + 0.07 * q; sx *= 1 - 0.05 * q;      // в падении чуть вытянута
    } else if (m.kind === 'pop'){                   // серия стягивается к своему центру, набухает и раскаляется
      const e = p * p;
      y += (m.cy - y) * CFG.POP_GATHER * e;
      const s = 1 + CFG.POP_SWELL * e + 0.035 * Math.sin(p * 46) * p;
      sx *= s; sy *= s; boost = 0.5 * p; hot = e;
    } else if (m.kind === 'grow'){
      const s = t < m.t0 ? 0.05 : 0.05 + 0.95 * backOut(p); sx *= s; sy *= s;
    } else if (m.kind === 'nope'){
      x += Math.sin(p * Math.PI * 4) * 5 * (1 - p) * L.k;
    } else if (m.kind === 'hop'){
      const q = Math.sin(Math.PI * p); y += m.dir * q * 7 * L.k; sy *= 1 + 0.08 * q;
    }
    if (p >= 1) b.mo = null;
  }
  if (b.press){ const q = clamp01((t - b.press) / (CFG.PRESS_MS / G.timeScale)); sx *= 1 + CFG.PRESS_SQUASH * 0.8 * q; sy *= 1 - CFG.PRESS_SQUASH * q; }   // палец лежит на капле
  const j = jelly(b, t); sy *= 1 - j; sx *= 1 + j * 0.75;
  if (V.dim > 0){ sy *= 1 - 0.1 * V.dim; sx *= 1 + 0.05 * V.dim; y += 3 * V.dim * L.k; }      // лампа гаснет — воск оседает
  const w = Math.sin(t * 0.0017 + b.seed * 6.283);
  sx *= 1 + CFG.WOBBLE * w; sy *= 1 - CFG.WOBBLE * w;
  x += Math.sin(t * 0.0011 + b.seed * 9.1) * 1.3 * L.k;
  b.px = x; b.py = y; b.boost = boost; b.arc = arc; b.hot = hot;
  b.prx = Math.max(2, Math.min(L.rxBase, hwAt(L, y) - CFG.WALL_GAP * L.k) * sx); b.pry = Math.max(2, L.ry * sy);
}
function poseAll(t){
  if (!LAY) return;
  const risers = [];
  for (const b of V.blobs.values()){ const L = LAY.lamps[b.lamp]; if (!L) continue; poseBlob(b, t, L); if (b.arc > 0.01) risers.push(b); }
  // столбик уступает дорогу капле, которая проходит мимо
  for (const r of risers){
    const L = LAY.lamps[r.lamp], dir = r.px >= L.cx ? -1 : 1;
    for (const b of V.blobs.values()){
      if (b === r || b.lamp !== r.lamp) continue;
      const d = (b.py - r.py) / (L.slotH * 1.25);
      b.px += dir * L.rxBase * CFG.PUSH_SIDE * r.arc * Math.exp(-d * d);
    }
  }
}

// --- метаболлы: поле плотности на сетке, отдельно по цветам (сливаются только одноцветные капли) ---
// Один шар в поле класса cls. heavy — тяжёлая (темнее), hot 0..1 — раскалена перед «бульк».
function fieldBall(g, cls, x, y, rx, ry, amp, heavy, hot){
  const gw = g.gw, gh = g.gh, cell = g.cell, Fc = g.F[cls], iR2 = 1 / (CFG.FIELD_R * CFG.FIELD_R);
  const ex = rx * CFG.FIELD_R, ey = ry * CFG.FIELD_R, irx = 1 / rx, iry = 1 / ry;
  const x0 = Math.max(0, Math.floor((x - ex - g.x0) / cell)), x1 = Math.min(gw - 1, Math.ceil((x + ex - g.x0) / cell));
  const y0 = Math.max(0, Math.floor((y - ey - g.y0) / cell)), y1 = Math.min(gh - 1, Math.ceil((y + ey - g.y0) / cell));
  if (x1 < x0 || y1 < y0) return;
  g.used[cls] = true;
  if (y0 < g.rowMin) g.rowMin = y0; if (y1 > g.rowMax) g.rowMax = y1;
  for (let gy = y0; gy <= y1; gy++){
    const dy = (g.y0 + (gy + 0.5) * cell - y) * iry, dy2 = dy * dy;
    if (dy2 * iR2 >= 1) continue;
    const row = gy * gw;
    for (let gx = x0; gx <= x1; gx++){
      const dx = (g.x0 + (gx + 0.5) * cell - x) * irx, q = (dx * dx + dy2) * iR2;
      if (q >= 1) continue;
      const f = (1 - q) * (1 - q) * amp, i = row + gx;
      Fc[i] += f; if (heavy) g.HV[i] += f; if (hot > 0) g.HT[i] += f * hot;
    }
  }
}
// Капля в поле: тело и два «наплыва», которые медленно ходят внутри, — форма живая, как у лавы, а не ровный овал.
// Всплывающая капля тянет за собой хвост-нить: шарики на её же пути с отставанием, тоньше к концу; нить рвётся и втягивается.
function fieldBlob(g, L, b, t){
  const amp = 1 + b.boost, m = b.mo, lump = b.frozen || (m && m.kind === 'grow') ? 0 : CFG.LUMP;
  fieldBall(g, b.cls, b.px, b.py, b.prx, b.pry, amp * (1 - lump * 0.6), b.heavy, b.hot);
  if (lump > 0){
    const a = t * 0.0012 * (0.6 + b.seed * 0.8) + b.seed * 6.283;
    for (let k = 0; k < 2; k++){ const an = a + k * 2.5; fieldBall(g, b.cls, b.px + Math.cos(an) * b.prx * 0.34, b.py + Math.sin(an) * b.pry * 0.3, b.prx * 0.74, b.pry * 0.74, amp * lump, b.heavy, b.hot); }
  }
  if (m && m.kind === 'rise'){
    const p = clamp01((t - m.t0) / Math.max(1, m.t1 - m.t0)), wu = CFG.RISE_WINDUP;
    if (p > wu){
      const home = slotY(L, b.slot), fade = 1 - smooth(((p - wu) / (1 - wu) - CFG.TAIL_HOLD) / (1 - CFG.TAIL_HOLD));   // нить держится, потом рвётся и втягивается
      for (let k = 1; k <= CFG.TAIL_N; k++){
        const r = riseAt(m, home, L, Math.max(wu, p - k * CFG.TAIL_GAP)), rr = b.prx * (0.84 - 0.07 * k) * (0.35 + 0.65 * fade) * (k > 3 ? fade : 1);
        if (rr > 1.4) fieldBall(g, b.cls, r.x, r.y, rr, rr * 1.25, 1, b.heavy, 0);
      }
    }
  } else if (m && m.kind === 'settle'){          // оседающая капля тянет за собой короткую нить сверху
    const p = clamp01((t - m.t0) / Math.max(1, m.t1 - m.t0)), home = slotY(L, b.slot);
    for (let k = 1; k <= 3; k++){
      const pk = Math.max(0, p - k * 0.16), y = m.y0 + (home - m.y0) * (1 - Math.pow(1 - pk, 3)), rr = b.prx * (0.72 - 0.17 * k) * (1 - p);
      if (rr > 1.4) fieldBall(g, b.cls, b.px, y, rr, rr * 1.2, 1, b.heavy, 0);
    }
  }
}
// Свет на воске: ключевой сверху-слева, блик по Блинну, тёплая подсветка снизу от лампочки в подставке.
const LIT = { lx: -0.462, ly: -0.693, lz: 0.554, hx: -0.262, hy: -0.393, hz: 0.881 };
// Рисует воск лампы L в её offscreen-canvas: капли, брызги, свет по нормали из уклона поля. dim 0..1 — «лампа гаснет».
function renderField(L, dim, t){
  const g = L.grid, gw = g.gw, gh = g.gh, F = g.F, HV = g.HV, HT = g.HT, V1 = g.V1, V2 = g.V2, C1 = g.C1, d = g.img.data;
  for (let q = 0; q < 6; q++){ F[q].fill(0); g.used[q] = false; }
  HV.fill(0); HT.fill(0); V1.fill(0);
  g.rowMin = gh; g.rowMax = -1;
  for (const b of V.blobs.values()) if (b.lamp === L.i) fieldBlob(g, L, b, t);
  for (const f of V.fx){                         // брызги «бульк» — тоже воск: маленькие шарики с торможением в жидкости
    if (f.kind !== 'drop' || f.lamp !== L.i || t < f.t0) continue;
    const p = clamp01((t - f.t0) / (f.t1 - f.t0)), dt = (t - f.t0) / 1000 * G.timeScale, s = (1 - Math.exp(-4 * dt)) / 4;
    const r = f.r * Math.pow(1 - p, 0.7);
    if (r <= 1.2) continue;
    fieldBall(g, f.cls, f.x + f.vx * s, f.y + f.vy * s - 26 * dt, r, r, 1, false, 0);
    for (let k = 1; k <= 3; k++){                // тягучий след брызги: она ещё связана с местом, откуда вылетела
      const sk = s * (1 - 0.24 * k), rk = r * (0.82 - 0.2 * k) * (1 - p);
      if (rk > 1.1) fieldBall(g, f.cls, f.x + f.vx * sk, f.y + f.vy * sk - 26 * dt * (1 - 0.24 * k), rk, rk, 1, false, 0);
    }
  }
  d.fill(0);
  if (g.rowMax < 0){ g.ctx.putImageData(g.img, 0, 0); return; }
  const cls = []; for (let q = 0; q < 6; q++) if (g.used[q]) cls.push(q);
  const T = CFG.FIELD_T, E = CFG.FIELD_EDGE, wax = PAL.wax, nc = cls.length, r0 = g.rowMin, r1 = g.rowMax;
  for (let gy = r0; gy <= r1; gy++){             // проход 1: какой цвет главный в клетке
    for (let gx = 0; gx < gw; gx++){
      const i = gy * gw + gx;
      let v1 = 0, c1 = 0, v2 = 0;
      for (let k = 0; k < nc; k++){ const v = F[cls[k]][i]; if (v > v1){ v2 = v1; v1 = v; c1 = cls[k]; } else if (v > v2) v2 = v; }
      V1[i] = v1; V2[i] = v2; C1[i] = c1;
    }
  }
  const S = CFG.LIGHT_SLOPE / g.cell, SP = CFG.SPEC_POW, SA = CFG.SPEC_A;
  for (let gy = r0; gy <= r1; gy++){             // проход 2: цвет и свет
    for (let gx = 0; gx < gw; gx++){
      const i = gy * gw + gx, v1 = V1[i];
      if (v1 <= T - E) continue;
      const c1 = C1[i], v2 = V2[i], base = wax[c1], frozen = c1 === 5;
      const a = smooth((v1 - (T - E)) / (2 * E));
      const tt = clamp01((v1 - T) / (1.05 - T));
      const k1 = (1 - smooth(tt / 0.2)) * (frozen ? 0.12 : 0.36);     // светящаяся кромка: воск просвечивает по краю
      const k2 = smooth((tt - 0.5) / 0.5) * (frozen ? 0.2 : 0.14);    // лёгкое светлое ядро
      let r = base[0] + (255 - base[0]) * (k1 + k2), gg = base[1] + (255 - base[1]) * (k1 + k2), bb = base[2] + (250 - base[2]) * (k1 + k2);
      // нормаль из уклона поля: воск читается объёмным
      let nx = -((gx < gw - 1 ? V1[i + 1] : v1) - (gx > 0 ? V1[i - 1] : v1)) * S, ny = -((gy < gh - 1 ? V1[i + gw] : v1) - (gy > 0 ? V1[i - gw] : v1)) * S;
      if (nx > 2.5) nx = 2.5; else if (nx < -2.5) nx = -2.5; if (ny > 2.5) ny = 2.5; else if (ny < -2.5) ny = -2.5;
      const inv = 1 / Math.sqrt(nx * nx + ny * ny + 1); nx *= inv; ny *= inv;
      const diff = nx * LIT.lx + ny * LIT.ly + inv * LIT.lz;
      let m = 0.93 + 0.13 * (diff > 0 ? diff : diff * 0.6);
      if (ny < 0) m *= 1 + 0.2 * ny;                                 // верх капли глубже по цвету: свет идёт снизу
      const sd = nx * LIT.hx + ny * LIT.hy + inv * LIT.hz;
      let spec = sd > 0 ? Math.pow(sd, SP) * SA * (frozen ? 0.5 : 1) : 0;
      const bounce = ny > 0 ? ny * (frozen ? 0.08 : 0.34) : 0;                // низ капли нагрет лампочкой: светлее и теплее
      // тёмная линия на стыке разных цветов
      if (v2 > T * 0.7){ const df = v1 - v2; if (df < 0.24) m *= 1 - 0.42 * (1 - df / 0.24); }
      // тяжёлая капля — глубже и темнее
      if (HV[i] > 0 && !frozen){ const hv = Math.min(1, HV[i] / v1); m *= 1 - 0.46 * hv * (1 - 0.5 * k2); spec *= 0.8; }
      r = r * m + 255 * spec + 255 * bounce * 0.5; gg = gg * m + 255 * spec + 225 * bounce * 0.5; bb = bb * m + 250 * spec + 150 * bounce * 0.5;
      if (HT[i] > 0){ const h = Math.min(1, HT[i] / v1) * 0.62; r += (255 - r) * h; gg += (255 - gg) * h; bb += (240 - bb) * h; }   // раскалена перед «бульк»
      if (dim > 0){ const lum = (r * 0.3 + gg * 0.5 + bb * 0.2) * 0.42 + 14; r += (lum - r) * dim; gg += (lum - gg) * dim; bb += (lum * 1.08 - bb) * dim; }
      const o = i * 4;
      d[o] = r; d[o + 1] = gg; d[o + 2] = bb; d[o + 3] = a * 255;
    }
  }
  g.ctx.putImageData(g.img, 0, 0);
}

// --- рисование: именованные функции, что рисует и от чего зависит (§11) ---
let BG = null, BGKEY = '', SHX = 0, SHY = 0;
function sceneTransform(c){ const k = DPR * scale; c.setTransform(k, 0, 0, k, SHX * k, SHY * k); }
// Фон: чистая темнота с большим фиолетовым пятном света за лампами и гладкая тёмная столешница. Статика кешируется в offscreen-canvas.
function drawRoom(c){
  const shelfY = LAY ? LAY.shelfTop : H - CFG.SHELF_H, key = cv.width + 'x' + cv.height + ':' + shelfY.toFixed(1);
  if (!BG || BGKEY !== key){
    BG = document.createElement('canvas'); BG.width = cv.width; BG.height = cv.height; BGKEY = key;
    const x = BG.getContext('2d'), k = LAY ? LAY.k : 1; x.setTransform(DPR * scale, 0, 0, DPR * scale, 0, 0);
    x.fillStyle = PAL.bg2; x.fillRect(0, 0, W, H);
    const gl = x.createRadialGradient(W / 2, shelfY * 0.55, 10, W / 2, shelfY * 0.55, H * 0.66);
    gl.addColorStop(0, rgba(PAL.bgGlow, 0.95)); gl.addColorStop(0.55, rgba(PAL.bgGlow, 0.3)); gl.addColorStop(1, rgba(PAL.bgGlow, 0));
    x.fillStyle = gl; x.fillRect(0, 0, W, H);
    const tg = x.createLinearGradient(0, shelfY, 0, H); tg.addColorStop(0, PAL.wood[0]); tg.addColorStop(1, PAL.wood[1]);
    x.fillStyle = tg; x.fillRect(0, shelfY, W, H - shelfY);
    x.fillStyle = 'rgba(190,170,255,0.3)'; x.fillRect(0, shelfY, W, 1.6 * k);
  }
  const k = DPR * scale;
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (SHX || SHY){ c.fillStyle = PAL.bg2; c.fillRect(0, 0, cv.width, cv.height); }
  c.drawImage(BG, SHX * k, SHY * k);
  sceneTransform(c);
}
// Средний цвет воска в лампе — им светится стена. Пустая лампа светит тёплым.
function lampTint(L){
  let r = 0, g = 0, b = 0, n = 0;
  for (const v of V.blobs.values()){ if (v.lamp !== L.i || v.frozen) continue; const c = PAL.wax[v.cls]; r += c[0]; g += c[1]; b += c[2]; n++; }
  return n ? [r / n, g / n, b / n] : [255, 200, 130];
}
// Вспышка лампы от «бульк»: сила 0..1 и цвет.
function lampFlash(L, t){
  let f = 0, cls = 2;
  for (const q of V.fx) if (q.kind === 'flash' && q.lamp === L.i && t >= q.t0 && t < q.t1){ const v = 1 - (t - q.t0) / (q.t1 - q.t0); if (v > f){ f = v; cls = q.cls; } }
  return { f, cls };
}
// Пятно света от лампы на стене (ART-PLAN: радиальный градиент цвета ламп). light 0..1 — яркость, win — праздник, pulse — вспышка «бульк».
function drawWallGlow(c, L, t, light, win, pulse){
  const tint = lampTint(L), cy = L.gTop + L.GH * 0.55, R = L.GH * (0.64 + 0.25 * win + 0.1 * pulse);
  const gr = c.createRadialGradient(L.cx, cy, 10, L.cx, cy, R);
  const a = (0.27 + 0.34 * win + 0.2 * pulse + 0.025 * Math.sin(t * 0.0013 + L.i)) * light;
  gr.addColorStop(0, rgba(tint, a)); gr.addColorStop(0.5, rgba(tint, a * 0.4)); gr.addColorStop(1, rgba(tint, 0));
  c.globalCompositeOperation = 'lighter'; c.fillStyle = gr; c.fillRect(L.cx - R, cy - R, R * 2, R * 2); c.globalCompositeOperation = 'source-over';
  if (win > 0){                                 // лучи-ореол победы
    c.save(); c.translate(L.cx, cy); c.rotate(t * 0.0003); c.globalCompositeOperation = 'lighter'; c.fillStyle = rgba([255, 225, 170], 0.07 * win);
    for (let k = 0; k < 10; k++){ c.rotate(Math.PI / 5); c.beginPath(); c.moveTo(0, 0); c.lineTo(-R * 0.16, -R * 1.25); c.lineTo(R * 0.16, -R * 1.25); c.closePath(); c.fill(); }
    c.restore(); c.globalCompositeOperation = 'source-over';
  }
}
// Свечение воска наружу: ореол каждой капли на стене за лампой (сама лампа рисуется поверх и цвет не вымывается).
function drawHalos(c, L, light){
  if (light <= 0.02) return;
  c.globalCompositeOperation = 'lighter';
  for (const b of V.blobs.values()){
    if (b.lamp !== L.i || b.frozen) continue;
    const s = b.prx * CFG.HALO_K * (1 + 0.4 * b.hot);
    c.globalAlpha = Math.min(1, CFG.HALO_A * light * (b.heavy ? 0.5 : 1) * (1 + 1.2 * b.hot));
    c.drawImage(PAL.glow[b.cls], b.px - s, b.py - s, s * 2, s * 2);
  }
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}
// Свет ламп на столешнице: цветное отражение под каждой подставкой.
function drawShelfLight(c, light, t){
  const y = LAY.shelfTop, k = LAY.k;
  c.globalCompositeOperation = 'lighter';
  for (const L of LAY.lamps){
    const tint = lampTint(L), fl = lampFlash(L, t).f, gl = c.createRadialGradient(L.cx, y + 3, 4, L.cx, y + 3, L.W * 1.15);
    gl.addColorStop(0, rgba(tint, (0.5 + 0.3 * fl) * light)); gl.addColorStop(0.5, rgba(tint, (0.16 + 0.1 * fl) * light)); gl.addColorStop(1, rgba(tint, 0));
    c.fillStyle = gl; c.fillRect(L.cx - L.W * 1.2, y, L.W * 2.4, 60 * k);
  }
  c.globalCompositeOperation = 'source-over';
}
// Металл (латунь): трапеция с блеском по ширине, бликами-полосами и кольцами-канавками. hwT/hwB — полуширины сверху и снизу, rings — доли высоты.
function drawMetal(c, cx, yT, yB, hwT, hwB, rings){
  const hw = Math.max(hwT, hwB), gr = c.createLinearGradient(cx - hw, 0, cx + hw, 0), h = yB - yT;
  gr.addColorStop(0, PAL.metal[2]); gr.addColorStop(0.16, PAL.metal[1]); gr.addColorStop(0.31, PAL.metal[0]); gr.addColorStop(0.4, '#fff3cf'); gr.addColorStop(0.5, PAL.metal[1]); gr.addColorStop(0.8, PAL.metal[2]); gr.addColorStop(0.93, '#7a5220'); gr.addColorStop(1, '#2c1a0a');
  c.fillStyle = gr; c.beginPath(); c.moveTo(cx - hwT, yT); c.lineTo(cx + hwT, yT); c.lineTo(cx + hwB, yB); c.lineTo(cx - hwB, yB); c.closePath(); c.fill();
  const sh = c.createLinearGradient(0, yT, 0, yB); sh.addColorStop(0, 'rgba(255,255,255,0.16)'); sh.addColorStop(0.2, 'rgba(255,255,255,0)'); sh.addColorStop(0.7, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.34)');
  c.fillStyle = sh; c.fill();
  for (const u of rings || []){
    const y = yT + h * u, w = hwT + (hwB - hwT) * u;
    c.fillStyle = 'rgba(40,20,5,0.4)'; c.fillRect(cx - w, y, w * 2, Math.max(1, h * 0.022));
    c.fillStyle = 'rgba(255,240,200,0.26)'; c.fillRect(cx - w, y + Math.max(1, h * 0.022), w * 2, Math.max(0.8, h * 0.014));
  }
}
// Подставка лампы со шкалой тепла: сегменты-«нить накала» гаснут сверху вниз, последние два мигают (ART-PLAN).
function drawBase(c, L, t, heat, budget, light){
  const k = L.k, hwT = L.W * (CFG.GLASS_BOT + 0.035), hwB = L.W * 0.5;
  c.fillStyle = 'rgba(0,0,0,0.45)'; c.beginPath(); c.ellipse(L.cx, L.baseBot + 2 * k, hwB * 1.16, 7 * k, 0, 0, Math.PI * 2); c.fill();
  drawMetal(c, L.cx, L.baseTop, L.baseBot - 7 * k, hwT, hwB * 0.94, [0.1, 0.86]);
  drawMetal(c, L.cx, L.baseBot - 7 * k, L.baseBot, hwB * 1.03, hwB * 1.06, []);      // опорное кольцо
  // окошко шкалы
  const gw = 15 * k, gh = (L.baseBot - L.baseTop) - 30 * k, gx = L.cx - gw / 2, gy = L.baseTop + 13 * k;
  c.fillStyle = '#140a18'; c.beginPath(); c.roundRect(gx - 3.5 * k, gy - 3.5 * k, gw + 7 * k, gh + 7 * k, 6 * k); c.fill();
  c.strokeStyle = 'rgba(255,230,170,0.35)'; c.lineWidth = 1 * k; c.stroke();
  const n = Math.max(1, budget), gap = Math.min(2.2 * k, gh / n * 0.28), sh = (gh - gap * (n - 1)) / n, low = heat <= 2;
  let lit = 0;
  for (let s = 0; s < n; s++){
    const y = gy + gh - (s + 1) * sh - s * gap, on = s < heat;
    let a = on ? 1 : 0;
    if (on && low) a = 0.62 + 0.38 * Math.sin(t * 0.011);                        // последние два мигают тёплым
    if (!on && s === heat){ const q = clamp01((t - V.heatFlashAt) / (300 / G.timeScale)); a = (1 - q) * 0.9; }   // только что погасший сегмент дотлевает
    c.fillStyle = PAL.heatOff; c.beginPath(); c.roundRect(gx, y, gw, sh, Math.min(2.5 * k, sh / 2)); c.fill();
    if (a > 0){ lit += a; c.fillStyle = rgba(low && on ? [255, 120, 70] : PAL.heatOn, a * (0.35 + 0.65 * light)); c.beginPath(); c.roundRect(gx, y, gw, sh, Math.min(2.5 * k, sh / 2)); c.fill(); }
  }
  if (lit > 0 && light > 0.1){                   // свечение шкалы на латуни
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(0.55, 0.16 + lit * 0.05) * light;
    c.drawImage(PAL.glow[2], gx - 16 * k, gy + gh * (1 - Math.min(1, heat / n)) - 14 * k, gw + 32 * k, gh * Math.min(1, heat / n) + 28 * k);
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  }
}
// Крышка лампы с навершием.
function drawCap(c, L){
  const k = L.k, hwB = L.W * (CFG.GLASS_TOP + 0.03), hwT = hwB * 0.66, yB = L.gTop + 9 * k, yT = L.gTop - (CFG.CAP_H - 9) * k;
  drawMetal(c, L.cx, yT, yB, hwT, hwB, [0.78]);
  drawMetal(c, L.cx, yT - 5 * k, yT, hwT * 0.5, hwT * 0.62, []);
}
// Жидкость в колбе: светится синим у лампочки в подставке и темнеет к горлышку — на ней любой цвет воска контрастен.
// win 0..1 — «чистый свет» заливает снизу вверх; dim — лампа гаснет.
function drawLiquid(c, L, light, dim, win){
  const x = L.cx - L.W / 2 - 2, w = L.W + 4, on = light * (1 - dim);
  const mx = (q) => dim > 0 ? [q[0] + (44 - q[0]) * dim, q[1] + (42 - q[1]) * dim, q[2] + (60 - q[2]) * dim] : q;
  c.fillStyle = '#090518'; c.fillRect(x, L.gTop - 2, w, L.GH + 4);
  const gr = c.createLinearGradient(0, L.gBot, 0, L.gTop);
  gr.addColorStop(0, rgba(mx(PAL.liquid), 0.3 + 0.7 * light)); gr.addColorStop(0.5, rgba(mx([(PAL.liquid[0] + PAL.liquidTop[0]) / 2, (PAL.liquid[1] + PAL.liquidTop[1]) / 2, (PAL.liquid[2] + PAL.liquidTop[2]) / 2]), 0.3 + 0.7 * light)); gr.addColorStop(1, rgba(mx(PAL.liquidTop), 0.4 + 0.6 * light));
  c.fillStyle = gr; c.fillRect(x, L.gTop - 2, w, L.GH + 4);
  // лампочка у дна: яркое пятно и луч вверх
  c.globalCompositeOperation = 'lighter';
  const bl = c.createRadialGradient(L.cx, L.gBot, 2, L.cx, L.gBot, L.W * 0.95);
  bl.addColorStop(0, rgba([235, 240, 255], 0.75 * on)); bl.addColorStop(0.4, rgba([150, 150, 255], 0.28 * on)); bl.addColorStop(1, rgba([120, 110, 255], 0));
  c.fillStyle = bl; c.fillRect(L.cx - L.W, L.gBot - L.W, L.W * 2, L.W);
  const ray = c.createLinearGradient(0, L.gBot, 0, L.gTop); ray.addColorStop(0, rgba([190, 190, 255], 0.16 * on)); ray.addColorStop(1, rgba([190, 190, 255], 0));
  c.fillStyle = ray; c.beginPath(); c.moveTo(L.cx - L.W * 0.2, L.gBot); c.lineTo(L.cx + L.W * 0.2, L.gBot); c.lineTo(L.cx + L.W * 0.36, L.gTop); c.lineTo(L.cx - L.W * 0.36, L.gTop); c.closePath(); c.fill();
  c.globalCompositeOperation = 'source-over';
  if (win > 0){                                 // «чистый свет»: поднимается от подставки
    const top = L.gBot - (L.GH + 20) * win, wg = c.createLinearGradient(0, top - 30, 0, top + 30);
    wg.addColorStop(0, rgba([255, 240, 205], 0)); wg.addColorStop(1, rgba([255, 240, 205], 0.9));
    c.fillStyle = wg; c.fillRect(x, top - 30, w, 60);
    c.fillStyle = rgba([255, 240, 205], 0.9); c.fillRect(x, top + 30, w, L.gBot - top);
  }
}
// Пузырьки в жидкости: поднимаются всё время, лампа «живёт» и без ввода. Положение — функция времени.
function drawAmbientBubbles(c, L, t, light){
  for (const a of L.amb){
    let u = (t * a.sp / 1000 + a.ph) % 1; if (u < 0) u += 1;
    const y = L.gBot - 10 - u * (L.GH - 34), x = L.cx + (a.fx - 0.5) * 2 * Math.max(4, hwAt(L, y) - 8 * L.k) + Math.sin(t * 0.0021 + a.ph * 20) * 2.6;
    const al = Math.sin(Math.PI * u) * 0.34 * light, r = a.r * L.k;
    c.strokeStyle = 'rgba(255,244,226,' + al.toFixed(3) + ')'; c.lineWidth = 1; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke();
    c.fillStyle = 'rgba(255,255,255,' + (al * 0.9).toFixed(3) + ')'; c.beginPath(); c.arc(x - r * 0.35, y - r * 0.35, r * 0.3, 0, Math.PI * 2); c.fill();
  }
}
// Стекло поверх воска: объём колбы (светлая кромка слева, тень справа), один длинный мягкий блик, тонкий светлый кант.
function drawGlassFront(c, L, t){
  const k = L.k;
  c.save(); c.clip(L.path);
  const gr = c.createLinearGradient(L.cx - L.W / 2, 0, L.cx + L.W / 2, 0);
  gr.addColorStop(0, 'rgba(255,255,255,0.2)'); gr.addColorStop(0.12, 'rgba(255,255,255,0.03)'); gr.addColorStop(0.7, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(6,2,22,0.36)');
  c.fillStyle = gr; c.fillRect(L.cx - L.W / 2, L.gTop, L.W, L.GH);
  // блик повторяет левую стенку и сходит на нет к концам
  const hl = c.createLinearGradient(0, L.gBot, 0, L.gTop); hl.addColorStop(0.1, 'rgba(255,255,255,0)'); hl.addColorStop(0.34, 'rgba(255,255,255,0.42)'); hl.addColorStop(0.66, 'rgba(255,255,255,0.3)'); hl.addColorStop(0.84, 'rgba(255,255,255,0)');
  c.fillStyle = hl; c.beginPath();
  for (let s = 2; s <= 26; s++){ const u = s / 30, y = L.gBot - L.GH * u, x = L.cx - L.W * glassProfile(u) + 9 * k; if (s === 2) c.moveTo(x, y); else c.lineTo(x, y); }
  for (let s = 26; s >= 2; s--){ const u = s / 30, y = L.gBot - L.GH * u, w = (3 + 6 * Math.sin(Math.PI * (s - 2) / 24)) * k; c.lineTo(L.cx - L.W * glassProfile(u) + 9 * k + w, y); }
  c.closePath(); c.fill();
  // блик, пробегающий по стеклу после «бульк»
  for (const f of V.fx){
    if (f.kind !== 'glint' || f.lamp !== L.i || t < f.t0) continue;
    const p = clamp01((t - f.t0) / (f.t1 - f.t0)), y = L.gBot + 40 - (L.GH + 120) * p, a = 0.34 * Math.sin(Math.PI * p);
    c.save(); c.translate(L.cx, y); c.rotate(-0.42);
    const gg = c.createLinearGradient(0, -26 * k, 0, 26 * k); gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(0.5, 'rgba(255,255,255,' + a.toFixed(3) + ')'); gg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = gg; c.fillRect(-L.W, -26 * k, L.W * 2, 52 * k); c.restore();
  }
  c.restore();

// Пунктир со стрелкой: куда встанет капля b, если её тапнуть. Виден, пока палец лежит на капле, и у руки-подсказки.

// Эффекты внутри колбы: кольца «бульк», пузырьки, осколки застывшего воска.

// Эффекты поверх всей сцены: подписи звеньев цепочки («×2»), искры победы, дымок погасшей лампы, круг касания.

// Рука-подсказка: белая перчатка с вытянутым пальцем. (x, y) — кончик пальца, press 0..1 — нажатие, k — масштаб.

// Фраза победы: крупно, белым с обводкой, без карточки.

// Искры и пузыри победы; дымок проигрыша. Случайность — из V.rnd (сид от номера уровня).
function winFx(t){
  const ts = G.timeScale;

    const L = LAY.lamps[k % LAY.lamps.length], life = (700 + V.rnd() * 900) / ts, d = V.rnd() * 900 / ts;
    V.fx.push({ kind: 'bub', lamp: L.i, x: L.cx + (V.rnd() - 0.5) * L.W * 0.7, y: L.gBot - 16 - V.rnd() * L.GH * 0.5, vx: (V.rnd() - 0.5) * 16, vy: -(90 + V.rnd() * 150), r: 2.5 + V.rnd() * 5.5, cls: 2, t0: t + d, t1: t + d + life });

  }

function loseFx(t){

// Одна лампа целиком: подставка → жидкость → пузырьки → ореолы → воск → детали → эффекты → стекло → крышка → свечение наружу.

function render(t){

    const dt = (t - V.shake.t0) * G.timeScale;

    else if (dt >= 0){ const a = V.shake.amp * Math.pow(1 - dt / CFG.SHAKE_MS, 2); SHX = Math.sin(dt * 0.085) * a; SHY = Math.cos(dt * 0.12) * a * 0.75; }

}
// Шаг времени: события, уборка эффектов, след пузырьков, тост. Вызывается и кадром, и сторожем, и drive() — время абсолютное, повтор безопасен.
const AMB_RND = mulberry32(31337);
function tick(t){
  let guard = 0;
  while (V.events.length && V.events[0].at <= t && guard++ < 200){ const ev = V.events.shift(); ev.fn(ev.at); }
  if (V.fx.length) V.fx = V.fx.filter(f => f.t1 > t);
  for (const b of V.blobs.values()){            // всплывающая капля оставляет за собой пузырьки

  if (toastUntil && t > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
}

// --- ввод: Pointer Events, порог тап/драг 10 px, pointercancel = pointerup (§3) ---
let down = null;
function toVirtual(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
// Какая капля под точкой: в лампе, в стекло которой попали (с запасом по ширине), ближайшая к пальцу в «своих радиусах».
// Берётся видимое положение, поэтому по капле, которая плывёт вдоль стенки, тоже можно попасть.
function pickBlob(p){
  if (!LAY) return null;
  let best = null, bd = Infinity;
  for (const b of V.blobs.values()){
    const L = LAY.lamps[b.lamp];
    if (Math.abs(p.x - L.cx) > L.W / 2 + CFG.HIT_X_PAD) continue;
    if (b.mo && b.mo.kind === 'pop') continue;
    const dy = Math.abs(p.y - b.py);
    if (dy > L.slotH * CFG.HIT_Y) continue;
    const dx = Math.max(0, Math.abs(p.x - b.px) - b.prx), d = dy / L.slotH + dx / L.rxBase;
    if (d < bd){ bd = d; best = b; }
  }
  return best;
}
// Тап в точку сцены. id — капля, выбранная ещё в момент касания (палец лёг на неё, пока она двигалась); без id выбираем по точке сейчас.
function tapAt(p, id){
  if (G.screen !== 'game' || !G.s) return 'closed';
  const t = now();
  if (V.phase === 'win'){ if (t - V.phaseAt > CFG.WIN_SKIP_MS / G.timeScale){ log('input', 'tap.skip'); V.events = []; nextLevel(); return 'skip'; } return 'wait'; }
  if (V.phase !== 'idle') return 'closed';
  let b = null;
  if (id === undefined){ poseAll(t); b = pickBlob(p); }          // вызов из кода: выбираем по точке сейчас
  else if (id !== null){ b = V.blobs.get(id); if (!b) return 'gone'; }
  if (!b){ log('input', 'tap.miss'); return 'miss'; }
  const idx = G.s.lamps[b.lamp].findIndex(x => x.id === b.id);
  if (idx < 0) return 'gone';                    // капля уже лопнула по логике и доигрывает анимацию
  return tapBlob(b.lamp, idx);
}
cv.addEventListener('pointerdown', (e) => {
  Audio.init(); down = toVirtual(e); down.id = e.pointerId;
  if (G.screen === 'game' && G.s && V.phase === 'idle'){           // каплю фиксируем в момент касания; она сразу сминается под пальцем
    const t = now(); poseAll(t);
    const b = pickBlob(down); down.blob = b ? b.id : null;
    V.fx.push({ kind: 'touch', x: down.x, y: down.y, t0: t, t1: t + 320 / G.timeScale });
    if (b && !b.frozen){ b.press = t; Audio.press(); }
  }
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
function onUp(e){
  if (!down || e.pointerId !== down.id) return;
  const start = down, p = toVirtual(e); down = null;
  const pb = start.blob === undefined || start.blob === null ? null : V.blobs.get(start.blob);
  if (pb && pb.press){ pb.press = 0; if (pb.kicks.length < 6) pb.kicks.push({ t0: now(), a: -0.13 }); }       // отпустили — капля пружинит обратно
  if (e.type === 'pointercancel'){ log('input', 'tap.cancel'); return; }
  if (Math.hypot(p.x - start.x, p.y - start.y) > CFG.TAP_SLOP / scale){ log('input', 'tap.swipe'); return; }   // это свайп, а не тап
  tapAt(start, start.blob);                     // медленный тап и дрожь пальца не отменяют ход: считается капля, на которую палец лёг
}
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
const KEY_ROWS = ['1234567890', 'qwertyuiop', 'asdfghjkl;'];      // дубли на клавиатуру (§3): ряд клавиш = лампа, клавиша = капля снизу вверх
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  for (let r = 0; r < KEY_ROWS.length; r++){ const i = KEY_ROWS[r].indexOf(k); if (i >= 0 && G.s && G.screen === 'game'){ Audio.init(); tapBlob(r, i); return; } }
  if (k === ' ' || k === 'enter'){ const h = G.s && hint(G.s); if (h && G.screen === 'game'){ Audio.init(); tapBlob(h.lamp, h.idx); e.preventDefault(); } }
  if (k === 'backspace') startLevel(G.s ? G.s.li : G.save.level);
  if (k === 'm') goto('menu');
});
$('btn-reset').onclick = () => { Audio.init(); Audio.click(); log('input', 'button', 'reset'); startLevel(G.s ? G.s.li : G.save.level); };
$('btn-menu').onclick = () => { Audio.init(); Audio.click(); log('input', 'button', 'menu'); goto('menu'); };
$('btn-mute').onclick = () => { G.save.muted = !G.save.muted; save(); hud(); Audio.init(); Audio.click(); log('input', 'button', 'mute=' + G.save.muted); };

// --- цикл: rAF + watchdog setInterval; безопасно, потому что время абсолютное (§4). Кадр под try/catch: одно исключение не останавливает игру. ---
let lastFrame = 0;
function step(){
  try {
    const t = now(); tick(t);
    if (G.paused) return;
    const a = performance.now(); render(t);
    // слабый телефон: если кадр в среднем дольше порога, поле плотности грубеет на шаг (капли мягче по краю, механика та же)
    QUALITY.sum += performance.now() - a; QUALITY.n++;
    if (QUALITY.n >= CFG.SLOW_FRAMES){
      const avg = QUALITY.sum / QUALITY.n; QUALITY.sum = 0; QUALITY.n = 0;
      if (avg > CFG.SLOW_FRAME_MS && QUALITY.cell < CFG.FIELD_CELL_MAX && FROZEN === null){ QUALITY.cell++; LAY = null; layout(); log('event', 'quality', 'cell=' + QUALITY.cell + ' avgMs=' + avg.toFixed(1)); }
    }
  }
  catch (e){ if (G.errors.length < 20){ G.errors.push(String(e && e.stack || e)); console.error('[game] frame error', e); } }
}
function frame(){ lastFrame = performance.now(); step(); requestAnimationFrame(frame); }
setInterval(() => { if (performance.now() - lastFrame > 120) step(); }, 40);

// --- дебаг-хук (§6): состояние, любой экран, прогон времени, автоигра ---
window.LAVA_LAMPA = {
  G, V, CFG,
  state(){
    if (!G.s) return { screen: G.screen };
    const t = now(), h = handInfo(t);
    return { screen: G.screen, phase: V.phase, level: G.s.li + 1, lamps: G.s.lamps.map(lampStr), heat: G.s.heat, budget: G.s.budget, par: G.s.par, taps: G.s.taps,
      pops: G.s.pops, chainTaps: G.s.chainTaps, left: blobsLeft(G.s), shownLeft: V.left, win: isWin(G.s), lose: isLose(G.s), dead: isDead(G.s),
      animating: animating(t), hand: h ? { lamp: h.lamp, idx: h.idx, show: h.show, strict: h.strict } : null, errors: G.errors.length, firstPopMs: G.stats.firstPopMs };
  },
  play(n){ startLevel(Math.max(1, n || 1) - 1); return this.state(); },
  tap(lamp, idx){ const r = tapBlob(lamp | 0, idx | 0); return Object.assign({ result: r }, this.state()); },
  tapXY(x, y){ return tapAt({ x, y }); },                         // тап в виртуальных координатах сцены — тем же путём, что палец
  // Экранные координаты (CSS px) капли и руки — для проверки настоящими касаниями.
  blobXY(lamp, idx){ poseAll(now()); const b = G.s && G.s.lamps[lamp] && G.s.lamps[lamp][idx], v = b && V.blobs.get(b.id); if (!v) return null; const r = cv.getBoundingClientRect(); return { x: r.left + v.px * scale, y: r.top + v.py * scale }; },
  probe(){ const t = now(), h = handInfo(t); return { screen: G.screen, phase: V.phase, animating: animating(t), errors: G.errors.length, hand: h && h.show ? Object.assign({ strict: h.strict }, this.blobXY(h.lamp, h.idx)) : null, hint: h ? { lamp: h.lamp, idx: h.idx } : null }; },
  hint(){ return G.s ? hint(G.s) : null; },
  solve(){ return G.s ? solve(G.s) : null; },
  auto(delayMs){ const self = this, d = delayMs || 900; (function go(){ const h = G.s && G.screen === 'game' && V.phase === 'idle' ? hint(G.s) : null; if (!h) return; tapBlob(h.lamp, h.idx); setTimeout(go, d); })(); return this.solve(); },
  goto(screen){ goto(screen); return G.screen; },
  drive(sec){                                   // ручной прогон игрового времени: rAF заморожен в скрытой вкладке
    const n = Math.ceil(sec * 1000 / 16);
    for (let i = 0; i < n; i++){ SKEW += 16; tick(now()); if (i % 4 === 0) poseAll(now()); }
    step();
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  freeze(on){ FROZEN = on === false ? null : performance.now(); if (on === false) SKEW = 0; return FROZEN !== null; },   // остановить часы для покадровой съёмки
  quality(cell){ if (cell){ QUALITY.cell = cell; LAY = null; layout(); } return QUALITY.cell; },   // клетка поля плотности: 2 — чётко, 4 — грубо и быстро
  bench(n){ n = n || 120; const a = performance.now(); for (let i = 0; i < n; i++) render(now() + i * 16); return +((performance.now() - a) / n).toFixed(2); },   // среднее время кадра JS, мс
  unlockAll(on){ setUnlockAll(on === undefined ? true : on); if (G.screen === 'menu') goto('menu'); return G.save.unlockAll; },   // чит: открыть все уровни
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт ---
readPalette(); fit(); hud();
try { if (document.fonts && document.fonts.load){ document.fonts.load("900 40px 'Nunito'"); document.fonts.load("900 40px 'Nunito'", 'Чисто'); } } catch (e) {}
const startHash = location.hash.slice(1) === 'unlock' ? (setUnlockAll(true), 'menu') : location.hash.slice(1);
goto(startHash || 'menu');
requestAnimationFrame(frame);
log('event', 'boot', 'levels=' + LEVELS.length);
</script>
</body>
</html>
