<style>
/* Шрифт — свой файл (PROTO-BASE §1): Nunito, округлый, с кириллицей (vendor/, лицензия OFL). */
@font-face { font-family: 'Nunito'; font-weight: 200 1000; font-display: swap; src: url('vendor/nunito-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Nunito'; font-weight: 200 1000; font-display: swap; src: url('vendor/nunito-cyr.woff2') format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
/* Палитра — одно место; canvas читает цвета через getComputedStyle (PROTO-BASE §9). Значения — из ART-PLAN.md. */
:root{
  --page:#0a0714;                 /* фон вокруг кадра-«телефона» */
  --bg1:#3a2188; --bg2:#0b0720;   /* фон: фиолетовое пятно света за лампами и тёмные края */
  --ink:#fff4e6; --muted:#b9a8d6; --card:#2a1c44; --line:#4a3670;
  --wax-a:#ff4f9a; --wax-b:#2fe0d0; --wax-c:#ffb020; --wax-d:#a6f04a; --wax-e:#a879ff;   /* воск: розовый, бирюзовый, янтарный, лаймовый, фиалковый */
  --wax-frozen:#cfc8e6;           /* застывший воск */
  --liquid:#4a3ad8; --liquid-top:#150f4a;   /* жидкость в колбе: светится синим у лампочки, темнеет к горлышку */
  --glass-rim:rgba(255,255,255,.35);
  --metal-1:#ffe2a3; --metal-2:#c98f3a; --metal-3:#5c3a15;   /* латунь крышки и подставки: блик, тело, тень */
  --wood-1:#2b1c5a; --wood-2:#0d0822;                        /* столешница: тёмная, гладкая */
  --heat-on:#ffc24a; --heat-off:#33223f;                     /* шкала тепла */
  --good:#63d471; --good-d:#2f8f3e; --bad:#ff5d5d; --bad-d:#b23030; --accent:#ffb020; --accent-d:#b8720a;
  --frame-w:430px;
}
@media (prefers-color-scheme: light){ :root{ --page:#d9d2e6; } }   /* сцена — тёмная комната в любой теме; светлеет только фон вокруг кадра */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font:700 16px/1.3 'Nunito', system-ui, sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:var(--bg2);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:absolute;left:0;right:0;top:env(safe-area-inset-top);z-index:2;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;pointer-events:none}
header b{font-size:18px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:5px;background:rgba(20,12,36,.72);border:1.5px solid var(--line);border-radius:999px;padding:4px 11px 4px 7px;font-weight:900;font-size:17px;min-width:58px}
.chip svg{width:20px;height:20px;display:block}
.chip.low{border-color:var(--bad);color:#ffd0c8}
.chip.bump{animation:bump .26s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.24)}100%{transform:scale(1)}}
header button{pointer-events:auto}
#btn-mute{width:40px;height:40px;padding:0;border-radius:12px;background:rgba(20,12,36,.72);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
#btn-mute svg{width:22px;height:22px} #btn-mute .off{display:none} #btn-mute.muted .on{display:none} #btn-mute.muted .off{display:block}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
footer{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom);z-index:2;display:flex;gap:10px;justify-content:space-between;padding:0 12px 10px;pointer-events:none}
footer button{pointer-events:auto}
/* Кнопки объёмные: тень снизу, проседают при нажатии. */
button{font:900 16px/1 'Nunito', system-ui, sans-serif;cursor:pointer}
.btn{color:#2a1638;background:linear-gradient(#ffd36a,var(--accent));border:0;border-radius:14px;padding:13px 20px 14px;
  box-shadow:0 5px 0 var(--accent-d), 0 9px 16px rgba(0,0,0,.4);transform:translateY(0);transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d), 0 3px 6px rgba(0,0,0,.4)}
.btn.good{background:linear-gradient(#8cec97,var(--good));box-shadow:0 5px 0 var(--good-d), 0 9px 16px rgba(0,0,0,.4);color:#0f3015}
.btn.good:active{box-shadow:0 1px 0 var(--good-d), 0 3px 6px rgba(0,0,0,.4)}
.btn.ghost{background:linear-gradient(#59448a,#463470);box-shadow:0 5px 0 #2b1f4a, 0 9px 16px rgba(0,0,0,.4);color:var(--ink)}
.btn.ghost:active{box-shadow:0 1px 0 #2b1f4a, 0 3px 6px rgba(0,0,0,.4)}
.btn.small{padding:10px 14px 11px;font-size:14px;border-radius:12px}
#overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(8,4,18,.62);padding:20px}
#overlay.show{display:flex}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 20px 20px;max-width:350px;width:100%;text-align:center;
  box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pop .18s ease-out} /* стартует с видимого состояния, не с opacity:0 (§9) */
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.card h2{margin:0 0 8px;font-size:26px;font-weight:900} .card p{color:var(--muted);margin:0 0 16px;font-weight:700}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 10px}
.levels button{padding:10px 0 11px;font-size:15px;border-radius:11px;border:0;background:#463470;color:var(--ink);box-shadow:0 3px 0 #2b1f4a}
.levels button.cur{background:var(--accent);color:#2a1638;box-shadow:0 3px 0 var(--accent-d)}
.levels button.locked{opacity:.45}
.levels button.wide{grid-column:span 5}
.lock{display:inline-block;width:11px;height:9px;background:currentColor;border-radius:2px;position:relative;top:1px}
.lock::before{content:'';position:absolute;left:1.5px;top:-6px;width:8px;height:8px;border:2px solid currentColor;border-bottom:0;border-radius:5px 5px 0 0;box-sizing:border-box}
.cheat{margin-top:8px;font-size:12px;font-weight:700;padding:7px 10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted);border-radius:10px}
.help-list{text-align:left;color:var(--ink);margin:0 0 16px;padding:0;list-style:none;font-size:15px}
.help-list li{display:flex;gap:10px;align-items:center;margin:9px 0}
.help-list i{flex:0 0 26px;height:26px;border-radius:50%;display:block}
#toast{position:absolute;left:50%;bottom:84px;z-index:4;transform:translateX(-50%);background:rgba(20,12,36,.9);border:1.5px solid var(--line);padding:8px 14px;border-radius:12px;
  pointer-events:none;opacity:.98;transition:opacity .25s;white-space:nowrap}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card{animation:none} .chip.bump{animation:none} #toast{transition:none} .btn{transition:none} }
</style>
</head>
<body>
<div id="frame">
  <header>
    <b id="hud-level">Уровень 1</b>
    <div class="chips">
      <!-- цель без текста: сколько капель осталось в лампах -->
      <div class="chip" id="chip-left"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="11" rx="7" ry="6.2" fill="#ff4f9a"/><ellipse cx="7.6" cy="8.6" rx="2.2" ry="1.3" fill="#fff" opacity=".7"/></svg><span id="hud-left">0</span></div>
      <!-- тепло: сколько тапов осталось -->
      <div class="chip" id="chip-heat"><svg viewBox="0 0 20 20"><path d="M10 1.5c.6 3.4 5 5.2 5 10a5 5 0 0 1-10 0c0-2.2 1.2-3.3 2-4.6.4 1.3 1 2 1.8 2.2C8.400 6.5 9 3.800 10 1.5z" fill="#ffb020"/><path d="M10 9.500c.4 1.700 2.200 2.400 2.200 4.300a2.200 2.200 0 0 1-4.400 0c0-1.900 1.800-2.600 2.200-4.300z" fill="#fff3c4"/></svg><span id="hud-heat">0</span></div>
    </div>
    <button id="btn-mute" aria-label="звук">
      <svg class="on" viewBox="0 0 22 22"><path d="M3 8.500h3.500L11 4.500v13l-4.500-4H3z" fill="#fff4e6"/><path d="M14 7.500c1.600 1.900 1.600 5.100 0 7M16.500 5c3 3.300 3 8.700 0 12" fill="none" stroke="#fff4e6" stroke-width="1.800" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 22 22"><path d="M3 8.500h3.500L11 4.500v13l-4.500-4H3z" fill="#b9a8d6"/><path d="M14.500 8.500l5 5M19.500 8.500l-5 5" fill="none" stroke="#ff5d5d" stroke-width="1.800" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div id="game"><canvas id="cv"></canvas></div>
  <footer>
    <button id="btn-menu" class="btn ghost small">Меню</button>
    <button id="btn-reset" class="btn ghost small">Заново</button>
  </footer>
  <div id="overlay"><div class="card" id="card"></div></div>
  <div id="toast" class="hide"></div>
</div>
<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Лава-лампа». Лампа — столбик капель воска (строка жетонов снизу вверх).
// Ход: тап по капле — она всплывает на самый верх своей лампы (тяжёлая — тонет на дно).
// Три и больше одного цвета подряд лопаются («бульк»), столбик оседает, серии могут сойтись снова — цепочка.
// Тепло = число тапов на уровень. Победа — все лампы пусты. Проигрыш — тепло кончилось или воск уже не собрать.
// Этот блок исполняют и игра, и sim.mjs / test.mjs (core-load.mjs вырезает его по маркерам).
// ---------------------------------------------------------------------------
const CFG = {
  // --- правила ---
  POP_MIN: 3,             // столько капель одного цвета подряд лопается
  CAP: 10,                // вместимость лампы в каплях (9 цветных и место под застывший воск)
  SOLVE_NODES: 40000,     // предел узлов поиска на одну лампу; сверх него ответ «неизвестно», а не «тупик»
  // --- генератор уровней после ручных (11+) ---
  GEN_TRIES: 18,          // столько раскладок пробуем ради «красивой» (нужный par и цепочка в решении)
  GEN_TRIES_MAX: 240,     // дальше берём любую решаемую
  GEN_SEED: 7000,         // сдвиг сида генератора; сид уровня = GEN_SEED + n * GEN_SEED_STEP
  GEN_SEED_STEP: 7919,
  GEN_TIERS: 5,           // длина «пилы» сложности: лёгкий … сложный, затем снова лёгкий
  GEN_3LAMPS_FROM: 25,    // с какого уровня на сложном зубце бывает три лампы
  // --- обучение и подсказка ---
  HINT_IDLE_MS: 8000,     // столько бездействия — и рука показывает ход из решения
  HAND_DELAY_MS: 320,     // пауза после конца анимации до появления руки
  HAND_CYCLE_MS: 1150,    // один «тык» руки
  // --- анимация хода (мс; делятся на timeScale) ---
  RISE_MS: 250,           // подъём капли: база
  RISE_PER_SLOT_MS: 56,   // подъём: добавка за каждый пройденный слот
  RISE_SLIM: 0.68,        // во сколько раз худеет капля в пути
  RISE_STRETCH: 0.46,     // на сколько вытягивается по высоте в пути
  RISE_SIDE: 1.45,        // на сколько своих полуширин уходит к стенке, обтекая столбик
  PUSH_SIDE: 0.34,        // на сколько полуширин столбик уступает ей дорогу
  GAP_CLOSE_AT: 0.3,      // доля подъёма, после которой столбик начинает оседать в освободившийся слот
  SETTLE_MS: 230,         // оседание капли в слот
  SETTLE_STAGGER_MS: 26,  // задержка оседания между соседними каплями
  POP_DELAY_MS: 90,       // пауза между концом подъёма и первым «бульк»
  POP_SQUEEZE_MS: 210,    // серия стягивается к центру и раскаляется перед «бульк»
  RUN_STAGGER_MS: 150,    // пауза между сериями, которые лопаются одной волной
  SETTLE_DELAY_MS: 50,    // пауза между «бульк» и оседанием
  CHAIN_PAUSE_MS: 200,    // пауза между звеньями цепочки (ART-PLAN: 150–250 мс)
  INTRO_MS: 420,          // капли «вздуваются» на старте уровня
  INTRO_STAGGER_MS: 34,
  WIN_MS: 1900,           // праздник «чистый свет», затем следующий уровень
  WIN_SKIP_MS: 500,       // раньше этого тап праздник не пропускает
  LOSE_MS: 950,           // лампа гаснет, затем карточка
  NOPE_MS: 260,           // капля качает «нет»
  TOAST_MS: 1500,         // сколько висит тост
  // --- эффекты ---
  RING_MS: 420,           // кольцо «бульк»
  BUBBLE_MS: 900,         // жизнь пузырька
  BUBBLES_PER_RUN: 8,     // пузырьков на серию (ART-PLAN: 6–10)
  FLASH_MS: 320,          // вспышка свечения колбы
  LABEL_MS: 720,          // подпись «×2» у звена цепочки
  // --- геометрия (виртуальные юниты при ширине кадра 400; масштабируются под высоту) ---
  LAMP_W: [186, 152, 112],   // ширина колбы при 1, 2, 3 лампах
  LAMP_H: [566, 540, 500],   // высота колбы
  LAMP_X: [[200], [103, 297], [69, 200, 331]],   // центры ламп
  TOP_PAD: 56,            // место под HUD над крышкой
  CAP_H: 26,              // крышка
  BASE_H: 74,             // подставка
  BASE_CUP: 14,           // на сколько колба утоплена в подставку
  SHELF_H: 62,            // полка (под ней — кнопки футера)
  LAYOUT_MAX_K: 1.08,     // лампа не растёт больше этого на высоких экранах
  GLASS_BOT: 0.40,        // полуширина колбы у дна, в долях ширины
  GLASS_TOP: 0.25,        // полуширина у горлышка
  GLASS_WIDE_U: 0.26,     // на какой высоте колба шире всего (0 — дно, 1 — верх)
  PAD_BOT: 16,            // отступ столбика от дна колбы
  PAD_TOP: 22,            // отступ от горлышка
  BLOB_RX: 0.205,         // полуширина капли в долях ширины колбы: капля 49–76 px, воск занимает лампу, а не висит бусинами
  BLOB_RY: 0.96,          // полувысота капли в долях полуслота: < 1 — между разными цветами остаётся щель
  WALL_GAP: 5,            // зазор между каплей и стеклом
  HIT_Y: 0.62,            // тап засчитывается капле, если он не дальше этой доли слота по высоте
  HIT_X_PAD: 10,          // и не дальше стекла + столько по ширине
  TAP_SLOP: 24,           // палец уехал дальше (экранные px) — это свайп, ход не засчитан; дрожь меньше порога ход не отменяет
  // --- ощущение: отклик на касание, «желе», «бульк» ---
  PRESS_MS: 70,           // за столько капля сминается под пальцем
  PRESS_SQUASH: 0.14,     // на сколько сминается
  JELLY_FREQ: 27,         // частота «желе», рад/с
  JELLY_DAMP: 7,          // затухание «желе», 1/с
  JELLY_DELAY_MS: 34,     // задержка волны по столбику на каждый слот расстояния
  JELLY_LIFE_MS: 900,     // сколько живёт один толчок
  RISE_WINDUP: 0.14,      // доля подъёма на «присед» перед стартом
  TRAIL_MS: 40,           // раз во столько всплывающая капля роняет пузырёк
  POP_GATHER: 0.42,       // на какую долю пути капли серии стягиваются к её центру перед «бульк»
  POP_SWELL: 0.2,         // на сколько серия набухает перед «бульк»
  LUMP: 0.3,              // доля «наплывов» в форме капли: 0 — ровный овал, больше — живее и неровнее
  TAIL_N: 9,              // шариков в хвосте-нити за всплывающей каплей
  TAIL_GAP: 0.042,        // отставание шариков хвоста, в долях пути
  TAIL_HOLD: 0.3,         // до этой доли пути нить цела, дальше рвётся и втягивается
  DROPS_PER_BLOB: 5,      // брызг воска с каждой лопнувшей капли
  DROP_MS: 540,           // жизнь брызги
  SHAKE_PX: 2.6,          // тряска сцены: множитель; сила растёт с номером звена цепочки
  SHAKE_MAX_PX: 9,        // потолок тряски
  SHAKE_MS: 260,          // длительность тряски
  HITSTOP_MS: 30,         // стоп-кадр на «бульк»
  HITSTOP_CHAIN_MS: 58,   // стоп-кадр на звене цепочки
  GLINT_MS: 430,          // блик пробегает по стеклу
  OUT_MS: 220,            // лампа гаснет между уровнями
  // --- свет ---
  HALO_A: 0.26,           // свечение капли наружу, на стену (ореол рисуется за лампой)
  HALO_K: 5.4,            // размер этого ореола в полуширинах капли
  LIGHT_SLOPE: 10,        // крутизна «купола» капли для расчёта нормали
  SPEC_POW: 22,           // жёсткость мягкого блика
  SPEC_A: 0.42,           // сила мягкого блика
  AMB_BUBBLES: 9,         // пузырьков в жидкости одной лампы
  // --- метаболлы ---
  FIELD_CELL: 1.5,        // клетка поля плотности, виртуальные юниты (⅓ разрешения экрана при DPR 2)
  FIELD_CELL_MAX: 4,      // до какой клетки грубеет поле на слабом телефоне (запасной путь из ART-PLAN)
  SLOW_FRAME_MS: 11,      // среднее время кадра выше этого — поле грубеет на шаг
  SLOW_FRAMES: 40,        // столько кадров подряд усредняем, прежде чем решать
  FIELD_R: 1.6,           // радиус влияния капли в её радиусах: чем меньше, тем уже перемычка между слипшимися одноцветными
  FIELD_T: 0.3713,        // порог: поле одинокой капли на её границе, (1 − 1/R²)²
  FIELD_EDGE: 0.05,       // мягкость края
  GLOW_K: 3.4,            // размер ореола в полуширинах капли
  GLOW_A: 0.34,           // сила ореола внутри колбы
  WOBBLE: 0.03,           // «дыхание» капли в покое
};
const COLOR_KEYS = 'abcde';            // a розовый · b бирюзовый · c янтарный · d лаймовый · e фиалковый

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Жетоны: 'a'..'e' — капля цвета; 'A'..'E' — тяжёлая капля того же цвета; '#' — застывший воск (не тапается).
function tokColor(t){ return t === '#' ? '#' : t.toLowerCase(); }
function isFrozen(t){ return t === '#'; }
function isHeavy(t){ return t !== '#' && t !== t.toLowerCase(); }

// Контент — декларативная таблица. Лампа — строка снизу вверх. slack — запас тепла сверх решения солвера.
// hand: 'all' — рука ведёт каждый ход и принимает только его; 'first' — рука показывает первый ход, дальше игрок сам.
// handAt: [лампа, индекс] — какой именно первый ход показать, если кратчайших решений несколько.
const LEVELS = [
  { n: 1,  lamps: ['abaaccbbc'], slack: 3, hand: 'all' },                                   // выдерни разделитель: розовые «бульк», потом цепочка
  { n: 2,  lamps: ['cbbaabacc'], slack: 3, hand: 'first' },                                 // нижняя всплывает к своим наверх
  { n: 3,  lamps: ['bcdbcdcbd'], slack: 4 },
  { n: 4,  lamps: ['edaedaeda'], slack: 4 },                                                // «зебра»: три подготовки и цепочка из трёх
  { n: 5,  lamps: ['bebebe', 'accdaacdd'], slack: 4 },                                      // две лампы, тепло общее
  { n: 6,  lamps: ['aacAbccbb'], slack: 3, hand: 'first', handAt: [0, 3] },                 // тяжёлая капля тонет к своим на дно
  { n: 7,  lamps: ['edEDed', 'abAcbabcc'], slack: 3 },
  { n: 8,  lamps: ['debedde#bb'], slack: 3, hand: 'first', handAt: [0, 2] },                // застывший воск лопается от соседнего «бульк»
  { n: 9,  lamps: ['bab#bcCacA', 'de#DedE'], slack: 3 },
  { n: 10, lamps: ['cbacbacba', 'dEAdaedea', 'cce#ece'], slack: 3 },                        // финал: три лампы
];

// --- одна лампа: ход, волна «бульк», полный расчёт ---
const RUN_RE = /([a-e])\1\1/i;          // три одного цвета подряд, тяжёлые считаются своим цветом
function lampMove(str, i){             // строка после хода или null, если ход невозможен
  const t = str[i];
  if (t === undefined || t === '#') return null;
  const rest = str.slice(0, i) + str.slice(i + 1);
  if (isHeavy(t)) return i === 0 ? null : t + rest;            // тяжёлая тонет на дно; на дне ей некуда
  return i === str.length - 1 ? null : rest + t;                // обычная всплывает; верхней некуда
}
// Одна волна: лопаются все серии ≥ POP_MIN и застывший воск вплотную к ним. null — лопать нечего.
function lampWave(str){
  if (!RUN_RE.test(str)) return null;
  const n = str.length, kill = new Array(n).fill(false), runs = [];
  let i = 0;
  while (i < n){
    const c = tokColor(str[i]); let j = i + 1;
    if (c !== '#'){
      while (j < n && tokColor(str[j]) === c) j++;
      if (j - i >= CFG.POP_MIN){ runs.push({ from: i, to: j - 1, color: c }); for (let k = i; k < j; k++) kill[k] = true; }
    }
    i = j;
  }
  const frozen = [];
  for (const r of runs){
    if (r.from > 0 && str[r.from - 1] === '#' && !kill[r.from - 1]){ kill[r.from - 1] = true; frozen.push(r.from - 1); }
    if (r.to < n - 1 && str[r.to + 1] === '#' && !kill[r.to + 1]){ kill[r.to + 1] = true; frozen.push(r.to + 1); }
  }
  let out = '';
  for (i = 0; i < n; i++) if (!kill[i]) out += str[i];
  return { str: out, runs, frozen, kill };
}
function lampResolve(str){             // все волны подряд, пока есть что лопать
  const waves = []; let w;
  while ((w = lampWave(str))){ waves.push(w); str = w.str; }
  return { str, waves };
}
function lampTap(str, i){              // ход + цепочка: { moved, str, waves } или null
  const m = lampMove(str, i);
  if (m === null) return null;
  const r = lampResolve(m);
  return { moved: m, str: r.str, waves: r.waves };
}
// Быстрый признак тупика: цвета меньше трёх капель уже не собрать; застывший воск без цветных не лопнет никогда.
function lampHopeless(str){
  const cnt = {}; let colored = 0, frozen = 0;
  for (const t of str){ if (t === '#') frozen++; else { colored++; const c = tokColor(t); cnt[c] = (cnt[c] || 0) + 1; } }
  if (frozen && !colored) return true;
  for (const c in cnt) if (cnt[c] < CFG.POP_MIN) return true;
  return false;
}
// Кратчайшее решение лампы поиском в ширину: массив индексов тапов; null — тупик доказан; undefined — упёрлись в предел узлов.
const SOLVE_CACHE = new Map();
function solveLamp(str){
  if (str === '') return [];
  if (SOLVE_CACHE.has(str)) return SOLVE_CACHE.get(str);
  let res = null;
  if (!lampHopeless(str)){
    const prev = new Map([[str, null]]);
    let q = [str], nodes = 0, done = false;
    while (q.length && !done && nodes < CFG.SOLVE_NODES){
      const nq = [];
      for (let a = 0; a < q.length && !done; a++){
        const cur = q[a];
        for (let i = 0; i < cur.length; i++){
          const m = lampMove(cur, i);
          if (m === null) continue;
          const out = RUN_RE.test(m) ? lampResolve(m).str : m;
          if (prev.has(out)) continue;
          nodes++; prev.set(out, { from: cur, move: i });
          if (out === ''){ done = true; break; }
          if (!lampHopeless(out)) nq.push(out);
        }
      }
      q = nq;
    }
    if (done){
      res = []; let at = '';
      while (prev.get(at)){ res.push(prev.get(at).move); at = prev.get(at).from; }
      res.reverse();
    } else if (nodes >= CFG.SOLVE_NODES) res = undefined;
  }
  SOLVE_CACHE.set(str, res);
  return res;
}
// Что происходит по ходу решения: сколько серий лопнуло, сколько тапов дали две серии и больше, на каком тапе первый «бульк».
function pathInfo(str, path){
  let pops = 0, chainTaps = 0, firstPop = 0, maxPops = 0;
  path.forEach((i, k) => {
    const t = lampTap(str, i); let p = 0;
    for (const w of t.waves) p += w.runs.length;
    pops += p; if (p >= 2) chainTaps++; if (p && !firstPop) firstPop = k + 1; if (p > maxPops) maxPops = p;
    str = t.str;
  });
  return { pops, chainTaps, firstPop, maxPops };
}

// --- генератор уровней после ручных: детерминирован от номера уровня ---
function shuffleInPlace(arr, rnd){
  for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}
// spec: { colors: ['a','c'], heavy: сколько капель тяжёлые, frozen: сколько застывших, par: желаемая длина решения }
function genLamp(rnd, spec){
  let best = null;
  for (let k = 0; k < CFG.GEN_TRIES_MAX; k++){
    if (best && k >= CFG.GEN_TRIES) break;
    const toks = [];
    for (const c of spec.colors) for (let j = 0; j < CFG.POP_MIN; j++) toks.push(c);
    for (let h = 0; h < spec.heavy; h++){ const i = Math.floor(rnd() * toks.length); toks[i] = toks[i].toUpperCase(); }
    for (let f = 0; f < spec.frozen; f++) toks.push('#');
    const str = shuffleInPlace(toks, rnd).join('');
    if (lampWave(str)) continue;                        // лопается до первого хода
    const sol = solveLamp(str);
    if (!sol || sol.length < 2) continue;               // нерешаемо или решается одним тапом
    const info = pathInfo(str, sol);
    const score = (info.chainTaps ? 6 : 0) - Math.abs(sol.length - spec.par) * 2;
    if (!best || score > best.score) best = { str, score };
    if (score >= 6) break;
  }
  return best ? best.str : spec.colors.map(c => c + c).join('') + spec.colors.join('');   // запасная раскладка: пары, затем по одной сверху
}
const GEN_CACHE = new Map();
function genLevel(n){
  if (GEN_CACHE.has(n)) return GEN_CACHE.get(n);
  const rnd = mulberry32(CFG.GEN_SEED + n * CFG.GEN_SEED_STEP);
  const tier = (n - 1) % CFG.GEN_TIERS;               // 0 — лёгкий … 4 — сложный
  const lampsN = tier === 0 ? 1 : (tier === CFG.GEN_TIERS - 1 && n >= CFG.GEN_3LAMPS_FROM ? 3 : 2);
  const lamps = [];
  for (let k = 0; k < lampsN; k++){
    const nc = tier <= 1 && rnd() < 0.5 ? 2 : 3;
    const pool = shuffleInPlace(COLOR_KEYS.split(''), rnd);
    const heavy = tier >= 1 && rnd() < 0.55 ? (rnd() < 0.35 ? 2 : 1) : 0;
    const frozen = tier >= 2 && rnd() < 0.5 ? 1 : 0;
    lamps.push(genLamp(rnd, { colors: pool.slice(0, nc), heavy, frozen, par: 2 + Math.min(3, tier) }));
  }
  const def = { n, lamps, slack: tier >= 3 ? 1 : 2, gen: true };
  GEN_CACHE.set(n, def);
  return def;
}
function levelDef(li){ return li < LEVELS.length ? LEVELS[li] : genLevel(li + 1); }

// --- состояние уровня ---
function lampStr(lamp){ let s = ''; for (const b of lamp) s += b.t; return s; }
function createState(li){
  const L = levelDef(li); let id = 0, par = 0, left = 0;
  const lamps = L.lamps.map(str => str.split('').map(t => ({ id: id++, t })));
  for (const str of L.lamps){ const p = solveLamp(str); par += p ? p.length : NaN; left += str.length; }
  return { li, lamps, par, budget: par + L.slack, heat: par + L.slack, taps: 0, pops: 0, chainTaps: 0, firstPopTap: 0, last: null };
}
function cloneState(s){ return Object.assign({}, s, { lamps: s.lamps.map(l => l.slice()), last: null }); }
function blobsLeft(s){ let n = 0; for (const l of s.lamps) n += l.length; return n; }
function legalMoves(s){
  const out = [];
  s.lamps.forEach((l, li) => { const str = lampStr(l); for (let i = 0; i < str.length; i++) if (lampMove(str, i) !== null) out.push({ lamp: li, idx: i }); });
  return out;
}
// Ход: { lamp, idx }. Возвращает новое состояние; невозможный ход или пустое тепло — то же самое состояние.
// n.last описывает случившееся для оболочки: кто всплыл, какие волны и серии лопнули (по id капель).
function applyMove(s, m){
  const src = s.lamps[m.lamp];
  if (!src || s.heat <= 0 || lampMove(lampStr(src), m.idx) === null) return s;
  const n = cloneState(s); let arr = n.lamps[m.lamp];
  const b = arr.splice(m.idx, 1)[0], heavy = isHeavy(b.t);
  if (heavy) arr.unshift(b); else arr.push(b);
  const waves = []; let w, pops = 0;
  while ((w = lampWave(lampStr(arr)))){
    const cur = arr;
    waves.push({ runs: w.runs.map(r => ({ color: r.color, ids: cur.slice(r.from, r.to + 1).map(x => x.id) })), frozen: w.frozen.map(k => cur[k].id) });
    pops += w.runs.length;
    arr = cur.filter((_, k) => !w.kill[k]);
  }
  n.lamps[m.lamp] = arr;
  n.taps++; n.heat--; n.pops += pops;
  if (pops >= 2) n.chainTaps++;
  if (pops && !n.firstPopTap) n.firstPopTap = n.taps;
  n.last = { lamp: m.lamp, id: b.id, from: m.idx, heavy, waves, pops };
  return n;
}
function isWin(s){ return s.lamps.every(l => l.length === 0); }
function isDead(s){ return s.lamps.some(l => solveLamp(lampStr(l)) === null); }      // хотя бы одну лампу уже не очистить
function isLose(s){ return !isWin(s) && (s.heat <= 0 || isDead(s)); }
// Решение всего уровня: лампы независимы, решаем по очереди. null — решения нет (или поиск упёрся в предел).
function solve(s){
  const out = [];
  for (let li = 0; li < s.lamps.length; li++){
    const p = solveLamp(lampStr(s.lamps[li]));
    if (!p) return null;
    for (const idx of p) out.push({ lamp: li, idx });
  }
  return out;
}
function minTaps(s){ const p = solve(s); return p ? p.length : Infinity; }
function hint(s){ const p = solve(s); return p && p.length ? p[0] : null; }           // следующий ход кратчайшего решения

// --- боты для симулятора (PROTO-BASE §6) ---
function randomRun(li, seed){          // случайные тапы
  const rnd = mulberry32(seed); let s = createState(li);
  while (!isWin(s) && !isLose(s)){ const m = legalMoves(s); s = applyMove(s, m[Math.floor(rnd() * m.length)]); }
  return { win: isWin(s), taps: s.taps, par: s.par, dead: !isWin(s) && s.heat > 0, chainTaps: s.chainTaps };
}
function greedyRun(li, seed){          // новичок: лопает сразу, где лопается больше всего, иначе тапает наугад
  const rnd = mulberry32(seed || 1); let s = createState(li);
  while (!isWin(s) && !isLose(s)){
    const left = blobsLeft(s); let best = [], bestN = -1;
    for (const m of legalMoves(s)){
      const popped = left - blobsLeft(applyMove(s, m));
      if (popped > bestN){ bestN = popped; best = [m]; } else if (popped === bestN) best.push(m);
    }
    s = applyMove(s, best[Math.floor(rnd() * best.length)]);
  }
  return { win: isWin(s), taps: s.taps, par: s.par, dead: !isWin(s) && s.heat > 0, chainTaps: s.chainTaps };
}
function plannerRun(li, seed){         // внимательный игрок: лопает сразу; иначе готовит «бульк» следующим тапом; в тупик сам не идёт
  const rnd = mulberry32(seed || 1); let s = createState(li);
  while (!isWin(s) && !isLose(s)){
    const left = blobsLeft(s); let best = [], bestN = -Infinity;
    for (const m of legalMoves(s)){
      const n = applyMove(s, m), popped = left - blobsLeft(n);
      let score = popped * 10;
      if (!popped){ const l2 = blobsLeft(n); for (const m2 of legalMoves(n)){ const p2 = l2 - blobsLeft(applyMove(n, m2)); if (p2 > score) score = p2; } }
      if (!isWin(n) && isDead(n)) score = -1;
      if (score > bestN){ bestN = score; best = [m]; } else if (score === bestN) best.push(m);
    }
    s = applyMove(s, best[Math.floor(rnd() * best.length)]);
  }
  return { win: isWin(s), taps: s.taps, par: s.par, dead: !isWin(s) && s.heat > 0, chainTaps: s.chainTaps };
}

// ---------------------------------------------------------------------------
// Оболочка: экраны, ввод, рендер, звук, сейв, дебаг-хук. Время абсолютное (§4):
// всё сравнивается с часами now() = performance.now() + SKEW (SKEW двигает только drive()).
// ---------------------------------------------------------------------------
const NAME = 'lava-lampa', VERSION = 'v0.4';
const T0 = performance.now();
let SKEW = 0, FROZEN = null;          // FROZEN — часы остановлены (LAVA_LAMPA.freeze): время идёт только через drive(), кадры снимаются точно
let HOLD = null, HELD = 0;             // стоп-кадр: часы замирают на несколько десятков мс в момент «бульк»
function now(){
  if (FROZEN !== null) return FROZEN + SKEW;
  let r = performance.now();
  if (HOLD){ if (r < HOLD.until) r = HOLD.from; else { HELD += HOLD.until - HOLD.from; HOLD = null; } }
  return r - HELD + SKEW;
}
function hitStop(ms){ if (FROZEN !== null || HOLD || V.flushing || ms <= 0) return; const r = performance.now(); HOLD = { from: r, until: r + ms }; }
function log(kind, name, info){            // журнал [game] — одна строка на событие (§11)
  console.log('[game] ' + JSON.stringify({ t: +((now() - T0) / 1000).toFixed(3), kind, name, info: info === undefined ? '' : String(info) }));
}

const SAVE_KEY = NAME + '.v1';
function loadSave(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) {} }

const G = {
  s: null,                       // состояние ядра
  screen: 'menu',                // menu | game | help | lose  (победа — без карточки: праздник в сцене и следующий уровень)
  save: Object.assign({ level: 0, muted: false, unlockAll: false }, loadSave()),   // unlockAll — чит «открыть все уровни» (PROTO-BASE §6)
  timeScale: 1,

  stats: { firstPopMs: 0, startAt: 0 },

// Вид: капли с позами, очередь событий анимации, эффекты. Логика уже посчитана ядром — вид только доигрывает.
const V = {
  blobs: new Map(),              // id → { id, t, cls, heavy, frozen, lamp, slot, seed, mo, px, py, prx, pry, boost }
  events: [],                    // [{ at, fn }] — отсортированы по at
  fx: [],                        // кольца, пузырьки, вспышки, подписи

  idleSince: 0,                  // с какого момента сцена спокойна

  heatFlashAt: 0,                // когда погас сегмент шкалы тепла
  rnd: mulberry32(1),            // случайность эффектов: сид от номера уровня
  flushing: false,
  introAt: 0,
  winAt: 0,                      // когда начался праздник победы
  dim: 0,                        // 0..1 — лампа гаснет (воск оседает)
  shake: null,                   // { t0, amp } — тряска сцены

};

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8) ---
// Всё идёт в общий выход: компрессор плюс «стеклянное» эхо (свёртка с затухающим шумом — тоже синтез, не файл).
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];      // пентатоника: звенья цепочки звучат вверх по ладу
const Audio = {
  ac: null, noise: null, out: null,
  init(){
    if (this.ac){ if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const ac = this.ac = new (window.AudioContext || window.webkitAudioContext)(), sr = ac.sampleRate, r = mulberry32(99);
      const len = Math.floor(sr * 0.5), buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = r() * 2 - 1;
      this.noise = buf;
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.connect(ac.destination);
      this.out = ac.createGain(); this.out.gain.value = 0.9; this.out.connect(comp);
      const il = Math.floor(sr * 1.2), ir = ac.createBuffer(2, il, sr);
      for (let ch = 0; ch < 2; ch++){ const q = ir.getChannelData(ch); for (let i = 0; i < il; i++) q[i] = (r() * 2 - 1) * Math.pow(1 - i / il, 2.8); }
      const conv = ac.createConvolver(), wet = ac.createGain(); conv.buffer = ir; wet.gain.value = 0.24;
      this.out.connect(conv); conv.connect(wet); wet.connect(comp);
    } catch (e) { this.ac = null; }
  },
  ok(){ return this.ac && this.out && !G.save.muted && !V.flushing; },
  // тон со скольжением частоты f0 → f1 за ms, начало через delay секунд
  glide(f0, f1, ms, type, vol, delay){
    if (!this.ok()) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), d = ms / 1000;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + Math.min(0.02, d * 0.3)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + d + 0.03);
  },
  // шум через фильтр: всплеск; f1 — куда уезжает частота фильтра
  hiss(freq, ms, vol, delay, type, f1){
    if (!this.ok() || !this.noise) return;
    const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), d = ms / 1000;
    s.buffer = this.noise; s.loop = true; f.type = type || 'bandpass'; f.frequency.setValueAtTime(freq, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + d); f.Q.value = 1.2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.1, t + Math.min(0.03, d * 0.3)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f).connect(g).connect(this.out); s.start(t); s.stop(t + d + 0.03);
  },
  press(){ this.glide(660, 540, 34, 'sine', 0.07); },
  rise(ms){ const d = Math.max(180, ms); this.glide(180, 520, d, 'sine', 0.14); this.glide(360, 1040, d, 'sine', 0.03); this.hiss(300, d, 0.035, 0, 'bandpass', 1500); log('sound', 'rise'); },
  sink(ms){ const d = Math.max(180, ms); this.glide(360, 105, d, 'sine', 0.17); this.hiss(1200, d, 0.03, 0, 'bandpass', 250); log('sound', 'sink'); },
  land(){ this.glide(185, 82, 85, 'sine', 0.22); this.hiss(420, 70, 0.06, 0, 'lowpass'); log('sound', 'land'); },
  // «бульк»: капля воды — быстрый взлёт частоты, тело ниже, россыпь пузырьков и звон по ладу; каждое звено цепочки выше
  bulk(k){
    const r = Math.pow(2, PENTA[Math.min(k - 1, PENTA.length - 1)] / 12);
    this.glide(280 * r, 940 * r, 100, 'sine', 0.3); this.glide(140 * r, 400 * r, 170, 'sine', 0.17, 0.02); this.hiss(1500 * r, 95, 0.07);
    for (let q = 0; q < 3; q++) this.glide(720 * r * (1 + 0.28 * q), 1500 * r * (1 + 0.28 * q), 44, 'sine', 0.06, 0.075 + 0.05 * q);
    this.glide(523.25 * r, 525 * r, 420, 'triangle', 0.055, 0.02); this.glide(784 * r, 786 * r, 300, 'sine', 0.03, 0.05);
    log('sound', 'bulk', 'chain=' + k);
  },
  crack(){ this.hiss(3200, 160, 0.17, 0, 'highpass'); this.glide(900, 300, 90, 'square', 0.05); this.glide(1900, 1500, 120, 'triangle', 0.05, 0.03); log('sound', 'crack'); },
  settle(){ this.glide(125, 70, 70, 'sine', 0.1); },
  nope(){ this.glide(190, 140, 110, 'triangle', 0.14); log('sound', 'nope'); },
  hop(){ this.glide(300, 360, 70, 'sine', 0.08); },
  warn(){ this.glide(520, 500, 60, 'square', 0.04, 0.05); this.glide(520, 500, 60, 'square', 0.04, 0.18); log('sound', 'warn'); },
  amb(x){ const f = 420 + x * 520; this.glide(f, f * 1.9, 46, 'sine', 0.022); },
  win(){
    [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => { this.glide(f, f * 1.004, 420, 'sine', 0.16, 0.075 * i); this.glide(f * 2, f * 2.004, 260, 'triangle', 0.03, 0.075 * i); });
    this.hiss(5200, 900, 0.035, 0.1, 'highpass'); log('sound', 'win');
  },
  lose(){ this.glide(300, 62, 700, 'sawtooth', 0.08); this.glide(150, 42, 780, 'sine', 0.2); this.hiss(900, 120, 0.05, 0, 'bandpass'); this.hiss(900, 90, 0.04, 0.16, 'bandpass'); log('sound', 'lose'); },
  click(){ this.glide(520, 620, 50, 'triangle', 0.1); },
};
function buzz(ms){ try { if (navigator.vibrate && !V.flushing) navigator.vibrate(ms); } catch (e) {} }

// --- экраны: DOM-оверлеи, любой открывается кодом или хешем (§6, §11) ---
const $ = (id) => document.getElementById(id);
// Уровень открыт, если до него дошёл прогресс или включён чит «открыть все уровни» (PROTO-BASE §6).
function isOpen(li){ return G.save.unlockAll || li <= G.save.level; }
function setUnlockAll(on){ G.save.unlockAll = !!on; save(); log('event', 'cheat', 'unlockAll=' + G.save.unlockAll); }
function goto(screen){
  if (screen === 'win'){ if (!G.s) startLevel(G.save.level); beginWin(); return; }     // победа — праздник в сцене, отдельной карточки нет
  if ((screen === 'game' || screen === 'lose') && !G.s){ startLevel(G.save.level); if (screen === 'game') return; }
  G.screen = screen; log('screen', screen);
  const ov = $('overlay'), card = $('card');
  if (screen === 'game'){ ov.classList.remove('show'); G.lastInputAt = now(); return; }
  ov.classList.add('show');
  if (screen === 'menu'){
    let lv = '';
    for (let i = 0; i < LEVELS.length; i++) lv += `<button data-act="lvl" data-li="${i}" class="${isOpen(i) ? (i === G.save.level ? 'cur' : '') : 'locked'}">${isOpen(i) ? i + 1 : '<span class="lock"></span>'}</button>`;
    const more = Math.max(G.save.level, LEVELS.length);
    lv += `<button data-act="lvl" data-li="${more}" class="wide ${isOpen(more) ? (G.save.level >= LEVELS.length ? 'cur' : '') : 'locked'}">${isOpen(more) ? 'Дальше: уровень ' + (more + 1) : '<span class="lock"></span> уровни ' + (LEVELS.length + 1) + '+'}</button>`;
    card.innerHTML = `<h2>Лава-лампа</h2><p>Уровень ${G.save.level + 1} · ${VERSION}</p>
      <div class="row"><button class="btn good" data-act="play">Играть</button><button class="btn ghost" data-act="help">Как играть</button></div>
      <div class="levels">${lv}</div>
      ${G.save.unlockAll ? '<button class="cheat" data-act="relock">Чит включён · закрыть обратно</button>' : '<button class="cheat" data-act="unlock">Чит: открыть все уровни</button>'}
      <button class="cheat" data-act="wipe">Сбросить прогресс</button>`;
  }
  if (screen === 'help') card.innerHTML = `<h2>Как играть</h2>
    <ul class="help-list">
      <li><i style="background:var(--wax-a)"></i><span>Тапни каплю — она всплывёт на самый верх лампы.</span></li>
      <li><i style="background:var(--wax-b)"></i><span>Три одного цвета вместе — бульк! Остальные оседают и могут лопнуть следом.</span></li>
      <li><i style="background:var(--wax-c)"></i><span>Очисти лампы, пока есть тепло: один тап — одно деление.</span></li>
      <li><i style="background:#7a2a55"></i><span>Тёмная капля со стрелкой вниз тяжёлая: она тонет на дно.</span></li>
      <li><i style="background:var(--wax-frozen)"></i><span>Застывший воск не тапается. Он лопается от соседнего «бульк».</span></li>
    </ul><button class="btn good" data-act="menu">Понятно</button>`;
  if (screen === 'lose'){
    const dead = G.s.heat > 0;
    const stuck = dead && G.s.lamps.some(l => l.length && l.every(b => isFrozen(b.t)));
    card.innerHTML = `<h2>${dead ? 'Не собрать' : 'Лампа остыла'}</h2><p>${stuck ? 'Застывший воск остался один — рядом больше нечему лопнуть.' : dead ? 'Оставшийся воск уже не сложить по три.' : 'Тепло кончилось, а воск остался.'}</p>
      <div class="row"><button class="btn good" data-act="retry">Ещё раз</button><button class="btn ghost" data-act="menu">Меню</button></div>`;
  }
}
$('card').addEventListener('click', (e) => {
  const el = e.target && e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return;
  const act = el.dataset.act;
  Audio.init(); Audio.click(); log('input', 'button', act);
  if (act === 'play') startLevel(G.save.level);
  else if (act === 'retry') startLevel(G.s ? G.s.li : G.save.level);
  else if (act === 'help') goto('help');
  else if (act === 'lvl'){ const li = +el.dataset.li; if (isOpen(li)) startLevel(li); else toast('Сначала пройди уровень ' + (G.save.level + 1)); }
  else if (act === 'unlock' || act === 'relock'){ setUnlockAll(act === 'unlock'); goto('menu'); }
  else if (act === 'wipe'){ G.save = { level: 0, muted: G.save.muted, unlockAll: false }; save(); goto('menu'); }
  else goto('menu');
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h === 'unlock'){ setUnlockAll(true); goto('menu'); } else if (h && h !== G.screen) goto(h); });

let toastUntil = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.remove('hide'); toastUntil = now() + CFG.TOAST_MS; }

// --- события анимации: дедлайны в абсолютном времени ---
function at(time, fn){
  const ev = { at: time, fn }; let i = V.events.length;
  while (i > 0 && V.events[i - 1].at > time) i--;
  V.events.splice(i, 0, ev);
}
function animating(t){ return V.events.length > 0 || t < V.busyUntil; }
// Доиграть всё мгновенно: игрок тапнул, не дожидаясь конца анимации. Логика уже в конечном состоянии — вид догоняет.
function flushAnim(){
  if (!V.events.length && now() >= V.busyUntil) return;
  V.flushing = true;
  let guard = 0;
  while (V.events.length && guard++ < 500){ const ev = V.events.shift(); ev.fn(ev.at); }
  for (const b of V.blobs.values()) b.mo = null;
  V.flushing = false; V.busyUntil = 0;
  log('fx.end', 'turn', 'flush');
}

// --- уровень ---
function clsOf(t){ return isFrozen(t) ? 5 : COLOR_KEYS.indexOf(tokColor(t)); }
function startLevel(li){
  li = Math.max(0, li | 0);
  G.s = createState(li);
  V.blobs.clear(); V.events = []; V.fx = []; V.phase = 'idle'; V.busyUntil = 0; V.flushing = false; V.shake = null; V.dim = 0; V.nextBlip = 0;
  V.rnd = mulberry32(500 + li * 31);
  const t = now(), ts = G.timeScale;
  G.s.lamps.forEach((lamp, k) => lamp.forEach((b, j) => {
    V.blobs.set(b.id, { id: b.id, t: b.t, cls: clsOf(b.t), heavy: isHeavy(b.t), frozen: isFrozen(b.t), lamp: k, slot: j, seed: V.rnd(),
      mo: { kind: 'grow', t0: t + j * CFG.INTRO_STAGGER_MS / ts, t1: t + (j * CFG.INTRO_STAGGER_MS + CFG.INTRO_MS) / ts }, px: 0, py: 0, prx: 1, pry: 1, boost: 0, arc: 0, hot: 0, kicks: [], press: 0, trailAt: 0 });
  }));
  V.left = blobsLeft(G.s); V.introAt = t; V.busyUntil = t + (CFG.INTRO_MS + CFG.INTRO_STAGGER_MS * CFG.CAP) * 0.6 / ts; V.idleSince = V.busyUntil;
  G.lastInputAt = t; G.stats = { firstPopMs: 0, startAt: t };
  LAY = null; layout();
  const L = levelDef(li);
  log('event', 'level.start', 'level=' + (li + 1) + ' lamps=' + L.lamps.join('|') + ' par=' + G.s.par + ' heat=' + G.s.heat);
  log('fx.start', 'intro');
  at(V.busyUntil, () => log('fx.end', 'intro'));
  goto('game'); hud();
}
function setChip(id, val){           // число в чипе подпрыгивает, когда меняется
  const el = $(id), txt = String(val);
  if (el.textContent === txt) return;
  el.textContent = txt;
  const chip = el.parentNode; chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump');
}
function hud(){
  $('hud-level').textContent = 'Уровень ' + (G.s ? G.s.li + 1 : G.save.level + 1);
  setChip('hud-left', G.s ? V.left : 0);
  setChip('hud-heat', G.s ? G.s.heat : 0);
  $('chip-heat').classList.toggle('low', !!G.s && G.s.heat <= 2 && !isWin(G.s));
  $('btn-mute').classList.toggle('muted', !!G.save.muted);
}

// Подсказка-рука: на учебных уровнях сразу, на остальных — после бездействия. Цель — ход из решения от текущего состояния,
// поэтому рука не теряется, что бы ни сделал игрок (уроки lesson-touch-fuzz-tutorial).
function handInfo(t){
  if (!G.s || G.screen !== 'game' || V.phase !== 'idle' || isWin(G.s) || isLose(G.s)) return null;
  const L = levelDef(G.s.li), teach = L.hand === 'all' || (L.hand === 'first' && G.s.taps === 0);
  let h = hint(G.s);
  if (!h) return null;
  if (L.handAt && G.s.taps === 0) h = { lamp: L.handAt[0], idx: L.handAt[1] };       // учебный первый ход задан уровнем (он из кратчайших — проверяет аудит)
  const b = G.s.lamps[h.lamp][h.idx];
  return { lamp: h.lamp, idx: h.idx, id: b.id, teach, strict: teach,
    show: !animating(t) && t - V.idleSince >= CFG.HAND_DELAY_MS / G.timeScale && (teach || t - G.lastInputAt >= CFG.HINT_IDLE_MS) };
}

// Тап по капле: вся логика. Возвращает строку-исход (для журнала и тестов).
function tapBlob(lampI, idx){
  if (!G.s || G.screen !== 'game' || V.phase !== 'idle') return 'closed';
  if (isWin(G.s) || isLose(G.s)) return 'ended';
  const lamp = G.s.lamps[lampI], b = lamp && lamp[idx];
  if (!b) return 'miss';
  const t = now(), vb = V.blobs.get(b.id), h = handInfo(t);
  G.lastInputAt = t;
  if (h && h.strict && (h.lamp !== lampI || h.idx !== idx)){         // учебный шаг: принимается только показанная капля, остальное не наказывается
    if (vb && !vb.mo) vb.mo = { kind: 'nope', t0: t, t1: t + CFG.NOPE_MS / G.timeScale };
    Audio.nope(); log('input', 'tap.guard', 'lamp=' + lampI + ' idx=' + idx);
    return 'guard';
  }
  if (isFrozen(b.t)){
    if (vb && !vb.mo) vb.mo = { kind: 'nope', t0: t, t1: t + CFG.NOPE_MS / G.timeScale };
    Audio.nope(); buzz(8); log('input', 'tap.frozen', 'lamp=' + lampI + ' idx=' + idx);
    return 'frozen';
  }
  if (lampMove(lampStr(lamp), idx) === null){                          // верхней некуда всплывать, тяжёлой на дне некуда тонуть: тепло не тратим
    if (vb && !vb.mo) vb.mo = { kind: 'hop', t0: t, t1: t + CFG.NOPE_MS / G.timeScale, dir: isHeavy(b.t) ? 1 : -1 };
    Audio.hop(); log('input', 'tap.noop', 'lamp=' + lampI + ' idx=' + idx);
    return 'noop';
  }
  flushAnim();
  const before = G.s, n = applyMove(before, { lamp: lampI, idx });
  if (n === before) return 'noop';
  G.s = n;
  log('input', 'tap', 'lamp=' + lampI + ' idx=' + idx + ' tok=' + b.t + ' heat=' + n.heat);
  playTurn(before, n);
  hud();
  return 'ok';
}

// Раскладывает ход по времени: подъём → волны «бульк» с оседанием → итог.
function playTurn(before, n){
  const last = n.last, lampI = last.lamp, t = now(), ts = G.timeScale;
  const old = before.lamps[lampI].map(b => b.id);
  let cur = old.slice(); cur.splice(last.from, 1); if (last.heavy) cur.unshift(last.id); else cur.push(last.id);
  const riser = V.blobs.get(last.id);
  const dist = last.heavy ? last.from : old.length - 1 - last.from;
  const riseMs = (CFG.RISE_MS + CFG.RISE_PER_SLOT_MS * dist) / ts;
  const y0 = riser.py;
  riser.slot = cur.indexOf(last.id);
  riser.mo = { kind: 'rise', t0: t, t1: t + riseMs, y0, side: last.id % 2 ? 1 : -1, dir: last.heavy ? -1 : 1 };       // сторона обхода та же, что у пунктира-подсказки
  riser.press = 0;
  at(t + riseMs * CFG.RISE_WINDUP, (when) => kick(lampI, y0, 0.1, when, last.id));       // отрыв: столбик вздрагивает
  if (last.heavy) Audio.sink(riseMs); else Audio.rise(riseMs);
  buzz(10);
  log('fx.start', last.heavy ? 'sink' : 'rise', 'id=' + last.id + ' slots=' + dist);
  at(t + riseMs, (when) => { log('fx.end', last.heavy ? 'sink' : 'rise'); Audio.land(); buzz(8); kick(lampI, riser.py, 0.21, when); });   // посадка: шлепок и волна по столбику
  V.heatFlashAt = t;
  if (n.heat <= 2 && n.heat > 0 && !isWin(n)) Audio.warn();
  // столбик смыкается: у обычной капли соседи сверху оседают, тяжёлая расталкивает нижних вверх
  const tGap = t + riseMs * (last.heavy ? 0.5 : CFG.GAP_CLOSE_AT);
  let k = 0;
  cur.forEach((id, j) => { if (id !== last.id && old.indexOf(id) !== j) moveTo(id, j, tGap + (k++) * CFG.SETTLE_STAGGER_MS / ts); });
  // волны
  let tw = t + riseMs + CFG.POP_DELAY_MS / ts, chain = 0, tEnd = t + riseMs;
  for (const w of last.waves){
    let tb = tw;
    w.runs.forEach((run, r) => {
      const ts0 = tw + r * CFG.RUN_STAGGER_MS / ts, tburst = ts0 + CFG.POP_SQUEEZE_MS / ts, ch = ++chain;
      at(ts0, () => {
        let cy = 0, cn = 0;
        for (const id of run.ids){ const b = V.blobs.get(id); if (b){ cy += slotY(LAY.lamps[lampI], b.slot); cn++; } }
        cy /= Math.max(1, cn);
        for (const id of run.ids){ const b = V.blobs.get(id); if (b) b.mo = { kind: 'pop', t0: ts0, t1: tburst, cy }; }
      });
      at(tburst, () => burst(lampI, run.ids, run.color, ch));
      tb = tburst;
    });
    if (w.frozen.length){ const ids = w.frozen, tf = tb; at(tf, () => burstFrozen(lampI, ids)); }
    const dead = new Set(w.frozen); for (const run of w.runs) for (const id of run.ids) dead.add(id);
    const next = cur.filter(id => !dead.has(id)), tset = tb + CFG.SETTLE_DELAY_MS / ts;
    let moved = 0;
    next.forEach((id, j) => { if (cur.indexOf(id) !== j) moveTo(id, j, tset + (moved++) * CFG.SETTLE_STAGGER_MS / ts); });
    if (moved) at(tset + CFG.SETTLE_MS / ts, () => Audio.settle());
    cur = next;
    tEnd = moved ? tset + (CFG.SETTLE_MS + moved * CFG.SETTLE_STAGGER_MS) / ts : tb + CFG.RING_MS * 0.4 / ts;
    tw = tEnd + CFG.CHAIN_PAUSE_MS / ts;
  }
  V.busyUntil = tEnd;
  at(tEnd, endTurn);
}
function moveTo(id, slot, time){
  at(time, (when) => {
    const b = V.blobs.get(id); if (!b) return;
    const y = b.py; b.slot = slot;
    b.mo = { kind: 'settle', t0: when, t1: when + CFG.SETTLE_MS / G.timeScale, y0: y };
    if (!V.flushing && b.kicks.length < 6) b.kicks.push({ t0: when + CFG.SETTLE_MS * 0.82 / G.timeScale, a: 0.12 });      // села — качнулась
  });
}
// «Бульк» серии: капли исчезают; брызги воска, кольца, пузырьки, вспышка колбы и блик по стеклу, толчок по столбику,
// стоп-кадр и тряска (сильнее с каждым звеном цепочки), звук выше с каждым звеном.
function burst(lampI, ids, color, chain){
  const t = now(), ts = G.timeScale, cls = COLOR_KEYS.indexOf(color);
  let cx = 0, cy = 0, n = 0, rr = 20;
  for (const id of ids){
    const b = V.blobs.get(id); if (!b) continue;
    V.blobs.delete(id); V.left--; cx += b.px; cy += b.py; n++; rr = b.prx;
    if (V.flushing) continue;
    V.fx.push({ kind: 'ring', lamp: lampI, x: b.px, y: b.py, r0: b.prx * 0.7, r1: b.prx * 2.4, w: 6, cls, t0: t, t1: t + CFG.RING_MS / ts });
    for (let k = 0; k < CFG.DROPS_PER_BLOB; k++){
      const a = V.rnd() * Math.PI * 2, sp = 110 + V.rnd() * 230;
      V.fx.push({ kind: 'drop', lamp: lampI, cls, x: b.px, y: b.py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, r: b.prx * (0.2 + V.rnd() * 0.24), t0: t, t1: t + CFG.DROP_MS * (0.6 + V.rnd() * 0.6) / ts });
    }
  }
  if (!n) return;
  cx /= n; cy /= n;
  if (!V.flushing){
    V.fx.push({ kind: 'burst', lamp: lampI, x: cx, y: cy, r: rr * 2.1, cls, t0: t, t1: t + 180 / ts });
    V.fx.push({ kind: 'ring', lamp: lampI, x: cx, y: cy, r0: rr * 1.2, r1: rr * 5.2, w: 3, cls, t0: t + 40 / ts, t1: t + (CFG.RING_MS + 160) / ts });
    for (let k = 0; k < CFG.BUBBLES_PER_RUN + Math.min(8, chain * 2); k++){
      const life = CFG.BUBBLE_MS * (0.6 + V.rnd() * 0.6) / ts;
      V.fx.push({ kind: 'bub', lamp: lampI, x: cx + (V.rnd() - 0.5) * 44, y: cy + (V.rnd() - 0.5) * 60, vx: (V.rnd() - 0.5) * 34, vy: -(60 + V.rnd() * 110), r: 2 + V.rnd() * 3.8, cls, t0: t, t1: t + life });
    }
    V.fx.push({ kind: 'flash', lamp: lampI, cls, t0: t, t1: t + CFG.FLASH_MS / ts });
    V.fx.push({ kind: 'glint', lamp: lampI, t0: t, t1: t + CFG.GLINT_MS / ts });
    if (chain >= 2) V.fx.push({ kind: 'label', lamp: lampI, x: cx, y: cy, text: '×' + chain, n: chain, cls, t0: t, t1: t + CFG.LABEL_MS / ts });
    V.shake = { t0: t, amp: Math.min(CFG.SHAKE_MAX_PX, CFG.SHAKE_PX * (0.6 + 0.5 * chain)) };
    kick(lampI, cy, 0.2 + Math.min(0.12, 0.04 * chain), t);
  }
  if (!G.stats.firstPopMs) G.stats.firstPopMs = Math.round(t - G.stats.startAt);
  Audio.bulk(chain); buzz(chain >= 2 ? [16, 30, 20] : 16);
  log('fx.start', 'bulk', 'color=' + color + ' n=' + n + ' chain=' + chain);
  at(t + CFG.RING_MS / ts, () => log('fx.end', 'bulk'));
  hud();
  hitStop(chain >= 2 ? CFG.HITSTOP_CHAIN_MS : CFG.HITSTOP_MS);
}
function burstFrozen(lampI, ids){
  const t = now(), ts = G.timeScale;
  for (const id of ids){
    const b = V.blobs.get(id); if (!b) continue;
    V.blobs.delete(id); V.left--;
    if (V.flushing) continue;
    V.fx.push({ kind: 'ring', lamp: lampI, x: b.px, y: b.py, r0: b.prx * 0.7, r1: b.prx * 2.1, w: 5, cls: 5, t0: t, t1: t + CFG.RING_MS / ts });
    for (let k = 0; k < 9; k++) V.fx.push({ kind: 'shard', lamp: lampI, x: b.px, y: b.py, vx: (V.rnd() - 0.5) * 220, vy: -40 - V.rnd() * 170, r: 3 + V.rnd() * 4.5, rot: V.rnd() * 6, t0: t, t1: t + CFG.BUBBLE_MS * 0.7 / ts });
  }
  Audio.crack(); log('fx.start', 'crack', 'n=' + ids.length); at(t + CFG.RING_MS / ts, () => log('fx.end', 'crack'));
  hud();
}
function endTurn(){
  const t = now();
  V.idleSince = t; log('fx.end', 'turn');
  if (V.flushing) return;                      // при доигрывании хода исход проверит следующий ход (он возможен только в живом состоянии)
  if (isWin(G.s)) beginWin();
  else if (isLose(G.s)) beginLose();
}
function beginWin(){
  if (V.phase === 'win') return;
  const t = now(), li = G.s.li;
  V.phase = 'win'; V.phaseAt = t; V.winAt = t; V.events = []; V.busyUntil = 0;
  G.screen = 'game'; $('overlay').classList.remove('show');
  if (li + 1 > G.save.level){ G.save.level = li + 1; save(); }
  Audio.win(); buzz([20, 40, 20, 40, 30]);
  log('event', 'level.win', 'level=' + (li + 1) + ' taps=' + G.s.taps + ' par=' + G.s.par + ' chainTaps=' + G.s.chainTaps + ' firstPopMs=' + G.stats.firstPopMs);
  log('fx.start', 'win');

}
function nextLevel(){                  // лампу выключают, на её месте включается следующая

  log('fx.end', 'win');
  const t = now(), li = G.s.li;
  V.phase = 'out'; V.phaseAt = t; V.events = [];
  log('fx.start', 'lamp.off');
